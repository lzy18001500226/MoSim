planner_id: astar_min_snap
map_id: map_corridor_gate
priority: P1

map:
  bounds:
    x: [-1.0, 8.0]
    y: [-2.5, 2.5]
    z: [0.0, 3.0]
  resolution: 0.2
  safety_margin: 0.28
  start: [0.0, 0.0, 1.0]
  goal: [7.0, 0.0, 1.0]
  obstacles:
    - type: box
      min: [2.6, -2.5, 0.0]
      max: [3.3, -0.45, 2.4]
    - type: box
      min: [2.6, 0.45, 0.0]
      max: [3.3, 2.5, 2.4]
    - type: box
      min: [5.0, -0.25, 0.0]
      max: [5.6, 1.8, 2.4]

astar:
  neighbor_type: 8
  heuristic: euclidean
  tie_breaker: 1.001
  max_iterations: 200000

smoothing:
  type: quintic_segment
  sample_dt_s: 0.05
  yaw_mode: face_velocity

limits:
  velocity_reference_m_s: 1.0
  velocity_max_m_s: 1.8
  acceleration_max_m_s2: 2.2
  jerk_max_m_s3: 7.0
  tilt_max_rad: 0.42
  segment_time_min_s: 0.9
  infeasible_scale_factor: 1.25
  max_rescale_iterations: 7

outputs:
  base_dir: results/planning/corridor_gate_astar_awff
