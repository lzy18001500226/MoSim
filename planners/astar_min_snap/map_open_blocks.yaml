planner_id: astar_min_snap
map_id: map_open_blocks
priority: P1
model_segment_limit: 90

map:
  bounds:
    x: [-45.0, 45.0]
    y: [-30.0, 30.0]
    z: [0.0, 3.0]
  resolution: 0.4
  safety_margin: 0.35
  planning_safety_margin: 0.35
  start: [-41.0, -26.0, 1.0]
  goal: [41.0, 26.0, 1.0]
  obstacles: []
  wall_groups:
    # Fixed template groups. Each group first occupies one 18 m x 6 m
    # axis-aligned rectangle. Collision/display boxes are generated from
    # this template; never hand-edit the two wall arm boxes directly.
    #
    # shape=L: short wall endpoint touches long wall endpoint.
    # shape=T: short wall midpoint touches long wall endpoint.
    # The dimensions are long_length_m x short_length_m x height_m with
    # thickness_m wall thickness.
    defaults:
      long_length_m: 18.0
      short_length_m: 6.0
      thickness_m: 0.32
      height_m: 3.0
      z_min: 0.0
    groups:
      - id: wall_01
        shape: L
        long_axis: y
        joint: lower
        short_side: negative
        bbox_min: [-16.14, -2.77]
      - id: wall_02
        shape: T
        long_axis: y
        joint: lower
        short_side: positive
        bbox_min: [6.53, 9.67]
      - id: wall_03
        shape: L
        long_axis: x
        joint: lower
        short_side: negative
        bbox_min: [-8.15, -26.88]
      - id: wall_04
        shape: T
        long_axis: x
        joint: upper
        short_side: positive
        bbox_min: [-35.33, -12.99]
      - id: wall_05
        shape: L
        long_axis: x
        joint: lower
        short_side: negative
        bbox_min: [17.41, 3.20]
      - id: wall_06
        shape: T
        long_axis: y
        joint: upper
        short_side: negative
        bbox_min: [26.00, -25.00]
      - id: wall_07
        shape: L
        long_axis: x
        joint: upper
        short_side: positive
        bbox_min: [-43.00, 17.00]
      - id: wall_08
        shape: T
        long_axis: x
        joint: lower
        short_side: positive
        bbox_min: [14.00, 20.00]
  random_obstacles:
    enabled: true
    seed: 20260518
    count: 1000
    radius_range: [0.30, 0.48]
    height_range: [3.0, 3.0]
    edge_margin_m: 2.0
    min_spacing_m: 0.55
    start_goal_clearance_m: 3.5
    distribution: stratified
    grid_cells: [20, 12]
    attempts_per_cell: 48
    clear_corridors: []

local_planning:
  enabled: true
  window_radius_m: 3.0
  commit_distance_m: 0.6
  local_goal_horizon_m: 10.0
  max_simplified_segment_length_m: 2.6
  goal_tolerance_m: 0.35
  max_replans: 260

astar:
  neighbor_type: 8
  heuristic: euclidean
  tie_breaker: 1.001
  max_iterations: 1200000
  search_margin_m: 8.0

ego_planner:
  enabled: true
  control_point_spacing_m: 1.2
  max_segments: 90
  max_iterations: 90
  step_size: 0.06
  max_step_m: 0.10
  clearance_m: 0.72
  accept_safety_margin_m: 0.45
  lambda_smooth: 0.35
  lambda_collision: 4.0
  lambda_fitness: 0.22
  convergence_tol_m: 0.001

smoothing:
  type: linear_segment
  sample_dt_s: 0.05
  yaw_mode: face_velocity

limits:
  velocity_reference_m_s: 0.8
  velocity_max_m_s: 2.0
  acceleration_max_m_s2: 2.5
  jerk_max_m_s3: 8.0
  tilt_max_rad: 0.45
  segment_time_min_s: 0.8
  infeasible_scale_factor: 1.25
  max_rescale_iterations: 6

outputs:
  base_dir: results/planning/single_obstacle_astar_awff
