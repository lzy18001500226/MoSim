planner_id: astar_min_snap
map_id: map_open_blocks
priority: P1
model_segment_limit: 60

map:
  bounds:
    x: [-40.0, 40.0]
    y: [-30.0, 30.0]
    z: [0.0, 3.0]
  resolution: 0.4
  safety_margin: 0.35
  planning_safety_margin: 0.50
  start: [-36.0, -26.0, 1.0]
  goal: [36.0, 26.0, 1.0]
  obstacles:
    # Five fixed wall groups generated with seed 20260519. Each group uses
    # one 18 m wall and one 6 m wall, both 0.32 m thick and 3.0 m high.
    # The 6 m wall connects to an endpoint of the 18 m wall. Group bounding
    # boxes are randomly placed with no overlap and no artificial route corridor.
    # Group 1: vertical 18 m wall.
    - type: box
      min: [-10.30, -2.61, 0.0]
      max: [-9.98, 15.39, 3.0]
    - type: box
      min: [-16.14, -2.77, 0.0]
      max: [-10.14, -2.45, 3.0]
    # Group 2: vertical 18 m wall.
    - type: box
      min: [6.53, 9.83, 0.0]
      max: [6.85, 27.83, 3.0]
    - type: box
      min: [6.69, 9.67, 0.0]
      max: [12.69, 9.99, 3.0]
    # Group 3: horizontal 18 m wall.
    - type: box
      min: [-7.99, -21.04, 0.0]
      max: [10.01, -20.72, 3.0]
    - type: box
      min: [-8.15, -26.88, 0.0]
      max: [-7.83, -20.88, 3.0]
    # Group 4: horizontal 18 m wall.
    - type: box
      min: [-35.33, -12.99, 0.0]
      max: [-17.33, -12.67, 3.0]
    - type: box
      min: [-17.49, -12.83, 0.0]
      max: [-17.17, -6.83, 3.0]
    # Group 5: horizontal 18 m wall.
    - type: box
      min: [17.57, 9.04, 0.0]
      max: [35.57, 9.36, 3.0]
    - type: box
      min: [17.41, 3.20, 0.0]
      max: [17.73, 9.20, 3.0]
  random_obstacles:
    enabled: true
    seed: 20260518
    count: 150
    radius_range: [0.30, 0.48]
    height_range: [3.0, 3.0]
    edge_margin_m: 2.0
    min_spacing_m: 0.90
    start_goal_clearance_m: 3.5
    distribution: stratified
    grid_cells: [8, 6]
    attempts_per_cell: 24
    clear_corridors: []

local_planning:
  enabled: true
  window_radius_m: 3.0
  commit_distance_m: 1.2
  local_goal_horizon_m: 10.0
  max_simplified_segment_length_m: 6.0
  goal_tolerance_m: 0.35
  max_replans: 260

astar:
  neighbor_type: 8
  heuristic: euclidean
  tie_breaker: 1.001
  max_iterations: 1200000
  search_margin_m: 8.0

ego_planner:
  enabled: true
  control_point_spacing_m: 1.2
  max_segments: 60
  max_iterations: 90
  step_size: 0.06
  max_step_m: 0.10
  clearance_m: 0.58
  accept_safety_margin_m: 0.35
  lambda_smooth: 0.35
  lambda_collision: 2.0
  lambda_fitness: 0.22
  convergence_tol_m: 0.001

smoothing:
  type: quintic_segment
  sample_dt_s: 0.05
  yaw_mode: face_velocity

limits:
  velocity_reference_m_s: 0.8
  velocity_max_m_s: 2.0
  acceleration_max_m_s2: 2.5
  jerk_max_m_s3: 8.0
  tilt_max_rad: 0.45
  segment_time_min_s: 0.8
  infeasible_scale_factor: 1.25
  max_rescale_iterations: 6

outputs:
  base_dir: results/planning/single_obstacle_astar_awff
