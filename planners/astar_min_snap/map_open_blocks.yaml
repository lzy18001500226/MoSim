planner_id: astar_min_snap
map_id: map_open_blocks
priority: P1

map:
  bounds:
    x: [-1.0, 7.0]
    y: [-2.5, 2.5]
    z: [0.0, 3.0]
  resolution: 0.2
  safety_margin: 0.35
  start: [0.0, 0.0, 1.0]
  goal: [6.0, 0.0, 1.0]
  obstacles:
    - type: box
      min: [2.0, -1.2, 0.0]
      max: [2.8, -0.2, 2.2]
    - type: cylinder
      center: [4.2, 0.8, 1.0]
      radius: 0.45
      height: 2.0

astar:
  neighbor_type: 8
  heuristic: euclidean
  tie_breaker: 1.001
  max_iterations: 200000

smoothing:
  type: quintic_segment
  sample_dt_s: 0.05
  yaw_mode: face_velocity

limits:
  velocity_reference_m_s: 1.2
  velocity_max_m_s: 2.0
  acceleration_max_m_s2: 2.5
  jerk_max_m_s3: 8.0
  tilt_max_rad: 0.45
  segment_time_min_s: 0.8
  infeasible_scale_factor: 1.25
  max_rescale_iterations: 6

outputs:
  base_dir: results/planning/single_obstacle_astar_awff
