planner_id: astar_min_snap
map_id: map_maze_building
priority: P0
model_segment_limit: 110

map:
  bounds:
    x: [-24.0, 24.0]
    y: [-16.0, 16.0]
    z: [0.0, 3.5]
  resolution: 0.35
  safety_margin: 0.24
  planning_safety_margin: 0.24
  start: [-21.0, -13.0, 1.2]
  goal: [21.0, 13.0, 1.2]
  obstacles:
    # Modular maze/building walls. Door gaps are left open intentionally.
    - {type: box, min: [-18.0, -10.5, 0.0], max: [-17.6, 7.5, 3.0], semantic: wall}
    - {type: box, min: [-18.0, 11.0, 0.0], max: [-17.6, 15.0, 3.0], semantic: wall}
    - {type: box, min: [-12.0, -15.0, 0.0], max: [-11.6, -4.2, 3.0], semantic: wall}
    - {type: box, min: [-12.0, 1.7, 0.0], max: [-11.6, 15.0, 3.0], semantic: wall}
    - {type: box, min: [-6.0, -15.0, 0.0], max: [-5.6, 2.8, 3.0], semantic: wall}
    - {type: box, min: [-6.0, 8.7, 0.0], max: [-5.6, 15.0, 3.0], semantic: wall}
    - {type: box, min: [0.0, -15.0, 0.0], max: [0.4, -6.7, 3.0], semantic: wall}
    - {type: box, min: [0.0, -0.8, 0.0], max: [0.4, 15.0, 3.0], semantic: wall}
    - {type: box, min: [6.0, -15.0, 0.0], max: [6.4, 0.8, 3.0], semantic: wall}
    - {type: box, min: [6.0, 6.7, 0.0], max: [6.4, 15.0, 3.0], semantic: wall}
    - {type: box, min: [12.0, -15.0, 0.0], max: [12.4, -9.7, 3.0], semantic: wall}
    - {type: box, min: [12.0, -3.8, 0.0], max: [12.4, 15.0, 3.0], semantic: wall}
    - {type: box, min: [-22.0, -8.0, 0.0], max: [-15.4, -7.6, 3.0], semantic: wall}
    - {type: box, min: [-7.6, -8.0, 0.0], max: [1.6, -7.6, 3.0], semantic: wall}
    - {type: box, min: [6.8, -8.0, 0.0], max: [20.0, -7.6, 3.0], semantic: wall}
    - {type: box, min: [-22.0, -1.5, 0.0], max: [-16.9, -1.1, 3.0], semantic: wall}
    - {type: box, min: [-11.6, -1.5, 0.0], max: [-3.9, -1.1, 3.0], semantic: wall}
    - {type: box, min: [1.4, -1.5, 0.0], max: [8.1, -1.1, 3.0], semantic: wall}
    - {type: box, min: [13.4, -1.5, 0.0], max: [22.0, -1.1, 3.0], semantic: wall}
    - {type: box, min: [-22.0, 5.0, 0.0], max: [-10.4, 5.4, 3.0], semantic: wall}
    - {type: box, min: [-5.1, 5.0, 0.0], max: [2.6, 5.4, 3.0], semantic: wall}
    - {type: box, min: [8.4, 5.0, 0.0], max: [22.0, 5.4, 3.0], semantic: wall}
    - {type: box, min: [-22.0, 11.0, 0.0], max: [-14.4, 11.4, 3.0], semantic: wall}
    - {type: box, min: [-9.1, 11.0, 0.0], max: [0.6, 11.4, 3.0], semantic: wall}
    - {type: box, min: [5.9, 11.0, 0.0], max: [22.0, 11.4, 3.0], semantic: wall}
  random_obstacles:
    enabled: false

local_planning:
  enabled: false
  note: "Initial maze/building render-control smoke uses global A* to validate geometry, collision proxies, and UE rendering. Re-enable local sensing after the raycast-occluded local planner is upgraded."
  window_radius_m: 6.0
  commit_distance_m: 1.0
  local_goal_horizon_m: 7.0
  max_simplified_segment_length_m: 2.0
  goal_tolerance_m: 0.35
  max_replans: 360
  occlusion:
    enabled: true
    blocker_semantics: [wall]
    fov_deg: 120
    sensor_radius_m: 6.0

visualization:
  radar_radius_m: 6.0
  radar_fade_radius_m: 9.0
  radar_cell_size_m: 0.6

astar:
  neighbor_type: 8
  heuristic: euclidean
  tie_breaker: 1.001
  max_iterations: 900000
  search_margin_m: 6.0

ego_planner:
  enabled: true
  control_point_spacing_m: 1.0
  max_segments: 110
  max_iterations: 100
  step_size: 0.05
  max_step_m: 0.08
  clearance_m: 0.62
  accept_safety_margin_m: 0.34
  lambda_smooth: 0.40
  lambda_collision: 4.8
  lambda_fitness: 0.25
  convergence_tol_m: 0.001

smoothing:
  type: quintic_segment
  sample_dt_s: 0.05
  yaw_mode: face_velocity

altitude_profile:
  mode: constant
  z_m: 1.2
  min_z_m: 1.0
  max_z_m: 2.2

limits:
  velocity_reference_m_s: 2.0
  velocity_max_m_s: 2.8
  acceleration_max_m_s2: 6.0
  jerk_max_m_s3: 45.0
  tilt_max_rad: 0.60
  segment_time_min_s: 0.55
  infeasible_scale_factor: 1.25
  max_rescale_iterations: 7

outputs:
  base_dir: results/planning/maze_building_astar_awff
