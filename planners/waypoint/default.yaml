planner_id: waypoint_min_snap
type: manual_waypoint_with_minimum_snap_smoothing
priority: P0

limits:
  velocity_max_m_s: 4.0
  acceleration_max_m_s2: 4.0
  jerk_max_m_s3: 12.0
  tilt_max_rad: 0.61

time_allocation:
  segment_time_min_s: 1.5
  velocity_reference_m_s: 2.0
  infeasible_scale_factor: 1.25
  max_rescale_iterations: 5

trackability:
  min_score: 0.8
  require_zero_dynamic_violations: true

outputs:
  reference_csv: results/{group}/{scene}/raw/reference_{scene_id}.csv
  trackability_report: results/{group}/{scene}/metrics/trackability_{scene_id}.json
