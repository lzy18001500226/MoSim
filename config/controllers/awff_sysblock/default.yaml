controller_id: awff_sysblock
type: sysblock_awff_pid_filtered_derivative_antiwindup
priority: P1

description: >
  Project Sysblock controller for the official Example1/2/3 closed-loop
  plant validation. This controller keeps the official plant, sensors,
  actuators, and result variable names, while replacing controller3_2 with a
  project Sysblock controller component.

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1AWFFSysblockClosedLoop
    - QuadrotorExperiments.Example2AWFFSysblockClosedLoop
    - QuadrotorExperiments.Example2HelixTunedAWFFSysblockClosedLoop
    - QuadrotorExperiments.Example3AWFFSysblockClosedLoop
  sysblock_controller: AWFF_FullControllerEquation_Sysblock
  graphical_sysblock_controller:
    hierarchical: AWFF_FullController_Sysblock
    flat_single_layer: AWFF_FullControllerFlatGraphical_Sysblock
    mcp_summary: results/model_checks/awff_sysblock/logs/sysplorer_graphical_sysblock_controller_check_20260511_summary.json
    static_contract: results/model_checks/awff_sysblock/graphical_contract/graphical_awff_sysblock_contract_20260512_behavior_gate.json
  verification_scope: official Example1 50 s, Example2 helix-tuned 50 s, Example3 120 s, plus Example1 mass +20%, lateral gust, and rotor 1 loss 15% robustness runs passed with real Sysplorer MCP evidence
  limitation: >
    Current controller is a flattened equation-form Sysblock implementation
    used to avoid Sysblock internal multi-input port-resolution issues when a
    graphical Sysblock controller is embedded as a Modelica plant component.
    The equation-form controller remains the temporary full-plant integration
    route because it preserves the same controller3_2 external interface and
    avoids the mixed Sysplorer/Sysblock embedding compiler limitation. This is
    an integration workaround, not a replacement for graphical Sysblock
    implementation. The graphical controllers must carry the same structure,
    timing, saturation, filtering, and mode/allocation behavior before a full
    scenario is considered complete. The current behavior gate is intentionally
    separate from the structure gate so missing Saturation, DeadZone, UnitDelay,
    DiscreteTimeIntegrator, Switch, or Product blocks are visible instead of
    being hidden behind a successful load/check result. As of 2026-05-12, the
    graphical behavior gate passes for the baseline AWFF graphical controller
    and the L1/INDI/fault-allocation graphical controller package. Full-plant
    performance conclusions still use the equation bridge until the mixed
    Sysplorer/Sysblock embedding limitation is removed.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: QuadrotorModel.Blocks.Controller.Controller
  implementation_target:
    - Sysblock controller component
    - Project-owned Example1 closed-loop wrapper
    - Project-owned Example2 closed-loop wrapper
    - Project-owned Example3 closed-loop wrapper
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder for current Example1 full validation
    attitude: sensors1_1.AngleMea
    yaw_ref: zero-order smoke placeholder
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

acceptance:
  graphical_contract:
    script: scripts/check_sysblock_graphics.py
    required: structure_ok true, behavior_equivalence_ok true before using graphical model as simulation counterpart
  graphical_mcp_check:
    script: scripts/check_graphical_sysblock_mcp.py
    required: load_file, check_model, simulate_model for graphical Sysblock controllers after structure and behavior gates pass
  full_example1:
    scenario_file: scenarios/official/example1_awff_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  full_example2:
    scenario_file: scenarios/official/example2_awff_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  full_example2_helix_tuned:
    scenario_file: scenarios/official/example2_awff_sysblock_helix_tuned.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON, quality_status pass
  full_example3:
    scenario_file: scenarios/official/example3_awff_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  robust_mass20:
    scenario_file: scenarios/robustness/example1_mass20_awff_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  robust_wind_gust:
    scenario_file: scenarios/robustness/example1_wind_gust_awff_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  robust_rotor1_loss15:
    scenario_file: scenarios/robustness/example1_rotor1_loss15_awff_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON

