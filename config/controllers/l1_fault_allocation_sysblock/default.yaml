controller_id: l1_fault_allocation_sysblock
type: sysblock_l1_residual_known_efficiency_fault_allocation
priority: P1-B

description: >
  Project Sysblock controller for known rotor efficiency degradation. It
  reuses the L1-inspired residual controller and adds a bounded allocation
  compensation on motor_1 for the 1号旋翼效率85% scenario.

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1Rotor1Loss15L1FaultAllocationSysblockClosedLoop
  sysblock_controller: AWFF_L1FaultAllocationControllerEquation_Sysblock
  verification_scope: real MWORKS_MCP 50 s full run complete for rotor-1 85% efficiency degradation; quality_status pass
  limitation: >
    This is a known-fault allocation compensation, not an online fault
    detector. The scenario provides rotor1_efficiency=0.85, and the controller
    applies a calibrated blended allocation gain to the corresponding motor
    command with output limits.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: AWFF_L1ResidualControllerEquation_Sysblock
  implementation_target:
    - Sysblock controller component
    - Project-owned rotor-1 85% efficiency degradation Example1 closed-loop wrapper
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder
    attitude: sensors1_1.AngleMea
    yaw_ref: zero-order placeholder
  outputs:
    motor_1: y, allocation compensated by rotor1_efficiency
    motor_2: y1
    motor_3: y2
    motor_4: y3
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

fault_allocation:
  affected_rotor: rotor_1
  target_component: quadChassisTest17_1.gain2.k
  nominal_lift_gain: 0.000854858
  degraded_lift_gain: 0.0007266293
  rotor1_efficiency: 0.85
  min_rotor_efficiency: 0.50
  rotor1_allocation_blend: 0.52
  compensation: motor_1_command_multiplied_by_1_plus_blend_times_inverse_eta_error_then_saturated

acceptance:
  rotor_degradation:
    scenario_file: config/scenarios/robustness/example1_rotor1_loss15_l1_fault_allocation_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON, quality_status pass

verified_evidence:
  source: MWORKS_MCP
  rotor1_loss15_full:
    scenario_file: config/scenarios/robustness/example1_rotor1_loss15_l1_fault_allocation_sysblock.yaml
