controller_id: l1_residual_sysblock
type: sysblock_awff_l1_inspired_residual_compensation
priority: P1

description: >
  Project Sysblock controller that extends the verified AWFF controller with
  L1-inspired residual compensation. It estimates low-frequency position-error
  residuals and injects bounded compensation into the outer-loop pitch, roll,
  and thrust commands.

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1L1SysblockClosedLoop
    - QuadrotorExperiments.Example3L1SysblockClosedLoop
    - QuadrotorExperiments.Example1Mass20L1SysblockClosedLoop
    - QuadrotorExperiments.Example1WindGustL1SysblockClosedLoop
    - QuadrotorExperiments.Example1Rotor1Loss15L1SysblockClosedLoop
  sysblock_controller: AWFF_L1ResidualControllerEquation_Sysblock
  verification_scope: >
    Full MWORKS_MCP evidence complete for nominal Example1, Example3 figure-8,
    mass +20%, wind gust, and rotor-1 85% efficiency degradation. Nominal,
    figure-8, mass, and wind pass the quality gate; rotor degradation improves
    against AWFF Sysblock but remains needs_iteration.
  limitation: >
    This is an engineering L1-inspired residual compensator, not a formal L1
    adaptive controller proof. It keeps the existing AWFF interface and uses
    bounded low-pass compensation to reduce wind and model-mismatch residuals.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: AWFF_FullControllerEquation_Sysblock
  implementation_target:
    - Sysblock controller component
    - Project-owned Example1 closed-loop wrapper
    - Project-owned Example3 figure-8 closed-loop wrapper
    - Project-owned mass +20% Example1 closed-loop wrapper
    - Project-owned wind-gust Example1 closed-loop wrapper
    - Project-owned rotor-1 85% efficiency degradation Example1 closed-loop wrapper
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder for current validation
    attitude: sensors1_1.AngleMea
    yaw_ref: zero-order placeholder
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

l1_residual_compensation:
  l1_model_decay: 1.25
  l1_filter_T: 0.20
  l1_gain_xy: 0.32
  l1_gain_z: 0.35
  l1_comp_limit_xy: 2.0
  l1_comp_limit_z: 2.0

acceptance:
  full_wind:
    scenario_file: config/scenarios/robustness/example1_wind_gust_l1_residual_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  rotor_degradation:
    scenario_file: config/scenarios/robustness/example1_rotor1_loss15_l1_residual_sysblock.yaml
    required: >
      check_model, simulate_model, result_manager, raw CSV, metrics, figures,
      replay JSON; current status is needs_iteration and must not be claimed as solved fault tolerance

