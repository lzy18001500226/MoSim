controller_id: improved_pid
type: mcp_tuned_pid_parameter_set
priority: P0

features:
  modelica_parameter_replacement: true
  mcp_parameter_search: true
  cross_scene_selection: true
  anti_windup: planned
  derivative_filter: planned
  reference_feedforward: planned
  command_saturation: planned

implementation_status:
  current_mworks_model: tuned_pid_parameters
  tuning_script: scripts/mworks/tune_improved_pid_mcp.py
  selected_candidate: pos_kp_165_att_170
  selection_reason: improves both official Example1 and Example3 RMSE while keeping max tilt lower than the best Example1-only candidate
  planned_next_step: replace the official PID block with a Sysblock/Modelica controller that adds anti-windup, derivative filtering, feedforward, and explicit command saturation

model_interface:
  replacement_component: controller3_2
  compatible_source_model: QuadrotorModel.Blocks.Controller.Controller
  implementation_target:
    - Sysblock subsystem
    - Modelica controller class
  inputs:
    position: sensors1_1.PosMea
    attitude: sensors1_1.AngleMea
    position_command: climbePath.position_command
    velocity: derived_from_position
    reference_velocity: derived_from_position_command
    reference_acceleration: derived_from_position_command
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
    debug_saturation: saturation_flag
    debug_integral: integral_state
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

position_loop:
  kp: [1.65, 1.65, 8.0]
  ki: [0.0, 0.0, 6.0]
  kd: [1.0, 1.0, 4.0]
  derivative_filter_alpha: planned
  integral_limit: planned

attitude_loop:
  kp: [14.142, 14.142, 5.0]
  ki: [0.0, 0.0, 0.0]
  kd: [1.70, 1.70, 0.0]
  derivative_filter_alpha: planned

limits:
  roll_max_rad: 0.61
  pitch_max_rad: 0.61
  acceleration_max_m_s2: 5.0
  motor_cmd_min: 0.0
  motor_cmd_max: 1.0

fallback:
  controller_id: pid_baseline
  trigger:
    - nan_output
    - saturation_ratio_gt_0_8
