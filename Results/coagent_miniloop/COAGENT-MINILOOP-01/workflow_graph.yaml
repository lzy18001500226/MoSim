workflow_id: WORKFLOW-COAGENT-MINILOOP-01
task_id: COAGENT-MINILOOP-01
canonical_task_goal: "Prove a full CoAgent architecture loop with file-level, manually reviewable artifacts before enabling real multi-conversation automation."
created_by: DispatchCenter
created_at: "2026-05-29T16:01:49+08:00"
nodes:
  - node_id: pmo_intake
    node_type: agent
    owner: PMO
    objective: "Record user goal and manual-review requirement."
    input_packets: []
    output_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/task_charter.yaml"
    state: completed
  - node_id: dispatch_board
    node_type: deterministic
    owner: DispatchCenter
    objective: "Create task board, mailbox, context, and scoped packet."
    input_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/task_charter.yaml"
    output_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/shared_task_board.yaml"
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/team_mailbox.yaml"
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/context_pack.yaml"
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/scoped_conversation_packet.yaml"
    state: completed
  - node_id: scoped_result
    node_type: agent
    owner: DispatchCenter
    objective: "Return a result packet for review."
    input_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/scoped_conversation_packet.yaml"
    output_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/result_packet.json"
    state: completed
  - node_id: verification_review
    node_type: review
    owner: Verification
    objective: "Review the result packet and record limitations."
    input_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/result_packet.json"
    output_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/review_packet.yaml"
    state: completed
  - node_id: closeout
    node_type: artifact
    owner: PMO
    objective: "Prepare closeout and human-review packet."
    input_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/review_packet.yaml"
    output_packets:
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/closeout_summary.md"
      - "Results/coagent_miniloop/COAGENT-MINILOOP-01/retrospective.md"
      - "CoAgent/docs/decisions/coagent_miniloop_01_human_review.md"
    state: review_required
edges:
  - from: pmo_intake
    to: dispatch_board
    edge_type: handoff
    condition: "Task charter exists."
  - from: dispatch_board
    to: scoped_result
    edge_type: depends_on
    condition: "Context pack and scoped packet exist."
  - from: scoped_result
    to: verification_review
    edge_type: review_gate
    condition: "Result packet exists."
  - from: verification_review
    to: closeout
    edge_type: handoff
    condition: "Review packet exists."
interrupts: []
artifacts:
  - "Results/coagent_miniloop/COAGENT-MINILOOP-01/"
review:
  required_review_nodes:
    - verification_review
    - closeout
  final_review_owner: PMO
  acceptance_state: needs_review
close_condition:
  - all_required_nodes_terminal
  - required_artifacts_manifested
  - final_review_recorded
  - integration_owner_named
