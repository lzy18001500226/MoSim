interface:
  display_name: "TY 机械系统建模"
  short_description: "若提示词未出现 TY 机械库名之一且未明确要求内置库/商业库路径处理相关机械任务，禁止使用；否则在已应用 ty-sysplorer-modeling-rules 后使用"
  default_prompt: "若任务提示词中未出现 TY 机械库名之一，且未明确要求走内置库 / 商业库路径处理相关机械场景，禁止调用 $ty-mechanical-modeling。须在已应用 ty-sysplorer-modeling-rules 且满足上述任一信号后，方可在 TY/同元商业机械库范围内执行模型新建、修复、验证与结果复核。"

policy:
  allow_implicit_invocation: true
