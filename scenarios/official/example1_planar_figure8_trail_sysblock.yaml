reference:
  type: official_eightpath_native_gui_reference
  takeoff_duration_s: 10.0
  figure8_duration_s: 110.0
  figure8_x_scale_m: 10.0
  figure8_y_scale_m: 10.0
  mission_altitude_m: 10.0
  x_omega: 0.02
  y_omega: 0.04
  raw_output_sample_rate_hz: 20
  native_gui_reference_trail_sample_rate_hz: 5
