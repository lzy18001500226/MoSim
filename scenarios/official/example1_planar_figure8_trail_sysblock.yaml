simulation:
  start_time_s: 0.0
  stop_time_s: 50.0
  step_size_s: 0.05
  solver: Dassl
  tolerance: 0.0001

reference:
  type: planar_figure8_return_land_reference
  takeoff_duration_s: 8.0
  figure8_duration_s: 30.0
  mission_altitude_m: 0.8
  raw_output_sample_rate_hz: 20
  native_gui_reference_trail_sample_rate_hz: 5
