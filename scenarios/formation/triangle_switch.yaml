experiment_id: formation_triangle_switch
scene_id: formation_triangle_switch
controller_id: improved_pid
priority: P2

model:
  source_package: QuadrotorModel
  model_name: QuadrotorModel.Examples.Example3
  model_path_hint: QuadrotorModel/package.mo
  realization: offline_reference_and_replay

leader_reference:
  file: results/raw/reference_planning_trackable_waypoint.csv
  source_scenario: planning_trackable_waypoint

formation:
  leader_id: uav_0
  follower_ids: [uav_1, uav_2]
  spacing_m: 1.5
  safety_distance_m: 0.8
  yaw_mode: leader_yaw
  initial_type: triangle
  switch:
    enabled: true
    from: triangle
    to: line
    start_time_s: 4.0
    duration_s: 2.0
  recover:
    enabled: true
    to: triangle
    start_time_s: 8.0
    duration_s: 2.0

simulation:
  start_time_s: 0.0
  stop_time_s: 11.71875
  step_size_s: 0.02

reference:
  type: leader_follower
  file: results/raw/reference_formation_triangle_switch.csv

result:
  raw_file: results/raw/reference_formation_triangle_switch.csv
  metrics_file: results/metrics/formation_triangle_switch.json
  replay_file: results/replay/formation_triangle_switch.json
  replay_html: results/replay_html/formation_triangle_switch.html
