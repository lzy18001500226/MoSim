experiment_id: delivery_mass_change
scene_id: delivery_mass_change
controller_id: nmpc_indi_l1
priority: P1

model:
  source_package: QuadrotorModel
  model_name: QuadrotorModel.Examples.Example3
  model_path_hint: QuadrotorModel/package.mo
  replacement_component: controller3_2
  realization: offline_mass_adaptation_demo

task:
  type: delivery_and_return
  delivery_time_s: 15.0
  waypoints:
    - [0.0, 0.0, 2.0]
    - [2.0, 1.0, 2.2]
    - [4.0, 0.0, 2.0]
    - [2.0, -1.0, 2.2]
    - [0.0, 0.0, 2.0]
  yaw_mode: face_velocity

simulation:
  start_time_s: 0.0
  stop_time_s: 30.0
  step_size_s: 0.01

reference:
  type: delivery_return_reference
  file: results/raw/reference_delivery_mass_change.csv

disturbance:
  mass_schedule:
    - time_s: 0.0
      mass_scale: 1.2
      phase: payload_attached
    - time_s: 15.0
      mass_scale: 1.0
      phase: payload_released

mass_adaptation:
  method: vertical_residual_lpf
  nominal_mass_kg: 1.0
  initial_mass_estimate_scale: 1.2
  residual_filter_alpha: 0.92
  mass_estimate_filter_alpha: 0.96
  compensation_limit_m_s2: 2.5
  mass_enter_threshold_m_s2: 0.45
  mass_recover_threshold_m_s2: 0.12
  min_hold_time_s: 2.0

result:
  raw_file: results/raw/delivery_mass_change.csv
  metrics_file: results/metrics/delivery_mass_change.json
  event_log: results/logs/delivery_mass_change_events.jsonl
  replay_file: results/replay/delivery_mass_change.json
  replay_html: results/replay_html/delivery_mass_change.html
