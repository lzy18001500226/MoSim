experiment_id: wind_nmpc_indi_l1_001
scene_id: wind_corridor
controller_id: nmpc_indi_l1
priority: P1

model:
  source_package: QuadrotorModel
  model_name: QuadrotorModel.Examples.Example3
  model_path_hint: QuadrotorModel/package.mo

simulation:
  start_time_s: 0.0
  stop_time_s: 35.0
  step_size_s: 0.01

reference:
  type: figure8
  amplitude_x_m: 2.0
  amplitude_y_m: 1.2
  altitude_m: 2.0
  angular_rate_rad_s: 0.45

disturbance:
  wind:
    type: constant_window
    start_time_s: 10.0
    stop_time_s: 24.0
    force_n: [1.0, 0.0, 0.0]

disturbance_estimator:
  method: acceleration_residual_lpf
  mass_kg: 1.0
  residual_filter_alpha: 0.90
  compensation_gain: 0.85
  compensation_limit_m_s2: 2.0
  wind_enter_threshold_m_s2: 0.45
  wind_recover_threshold_m_s2: 0.18
  enter_debounce_s: 0.2
  min_hold_time_s: 1.0

result:
  raw_file: results/raw/wind_nmpc_indi_l1.csv
  metrics_file: results/metrics/wind_nmpc_indi_l1.json
  figure_dir: results/figures/wind_nmpc_indi_l1
  event_log: results/logs/wind_nmpc_indi_l1_events.jsonl
  replay_file: results/replay/wind_nmpc_indi_l1.json
  replay_html: results/replay_html/wind_nmpc_indi_l1.html
