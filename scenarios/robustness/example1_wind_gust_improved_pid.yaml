experiment_id: robust_wind_gust_example1_improved_pid
scene_id: robust_wind_gust_example1
controller_id: improved_pid
priority: P1
evidence_level: real_sysplorer_mcp_robust_wind_gust_ablation

model:
  source_package: QuadrotorExperiments
  model_name: QuadrotorExperiments.Example1WindGustImprovedPID
  model_path_hint: models/QuadrotorExperiments/package.mo
  base_model_path_hint: QuadrotorModel/package.mo
  official_description: 阶梯爬升 15-19s 横向阵风 improved PID

controller:
  params_file: controllers/improved_pid/default.yaml
  replacement_component: controller3_2
  baseline_experiment: robust_wind_gust_example1_pid_baseline

disturbance:
  type: lateral_world_force_gust
  target_component: quadChassisTest17_1.body.frame_b
  start_time_s: 15.0
  duration_s: 4.0
  force_x_N: 0.22
  force_y_N: -0.10
  sine_amplitude_x_N: 0.08
  sine_amplitude_y_N: 0.04
  sine_frequency_Hz: 1.2
  purpose: external_wind_disturbance_robustness

simulation:
  start_time_s: 0.0
  stop_time_s: 50.0
  step_size_s: 0.01
  solver: Dassl
  tolerance: 0.0001

reference:
  type: official_climb_path
  file: results/official/example1_step/raw/reference_official_example1.csv

result:
  raw_file: results/robustness/wind_gust_example1/raw/robust_wind_gust_example1_improved_pid.csv
  metrics_file: results/robustness/wind_gust_example1/metrics/robust_wind_gust_example1_improved_pid.json
  figure_dir: results/robustness/wind_gust_example1/figures
  replay_file: results/robustness/wind_gust_example1/replay/robust_wind_gust_example1_improved_pid.json
  mcp_log: results/robustness/wind_gust_example1/logs/sysplorer_robust_wind_gust_example1_improved_pid_20260510.jsonl
