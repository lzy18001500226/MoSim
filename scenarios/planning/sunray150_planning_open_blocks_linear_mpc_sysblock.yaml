experiment_id: sunray150_planning_open_blocks_linear_mpc_sysblock
scene_id: planning_open_blocks
controller_id: linear_mpc_sysblock
priority: P1
evidence_level: real_sysplorer_mcp_sysblock_local_replanning_linear_mpc

model:
  source_package: QuadrotorExperiments
  model_name: QuadrotorExperiments.Sunray150PlanningOpenBlocksLinearMPCSysblockClosedLoop
  model_path_hint: models/QuadrotorExperiments/Sunray150PlanningOpenBlocksLinearMPCSysblockClosedLoop.mo
  base_model_path_hint: QuadrotorModel/package.mo
  extra_model_files:
    - models/QuadrotorExperiments/PlannedQuinticReference.mo
    - models/QuadrotorExperiments/PlanningNavigationDisplay.mo
  official_description: Sunray150 单机局部感知避障 + 实时重规划 LinearMPC-style Sysblock 闭环

controller:
  params_file: controllers/linear_mpc_sysblock/default.yaml
  replacement_component: controller3_2
  require_baseline_improvement: false
  sysblock_controller_file: models/QuadrotorControllerBlocks/AWFF_LinearMPCOuterLoopControllerEquation_Sysblock.mo
  graphical_sysblock_model: AWFF_InnovationGraphicalControllers.AWFF_LinearMPCControllerGraphical_Sysblock
  graphical_sysblock_file: models/QuadrotorControllerBlocks/AWFF_InnovationGraphicalControllers.mo

simulation:
  start_time_s: 0.0
  stop_time_s: 80.2129830999
  step_size_s: 0.01
  solver: Dassl
  tolerance: 0.0001

reference:
  type: local_sensing_receding_astar_ego_min_snap
  planner_config: planners/astar_min_snap/map_open_blocks.yaml
  file: results/planning/single_obstacle_astar_awff/raw/reference.csv
  trackability_report: results/planning/single_obstacle_astar_awff/metrics/trackability_report.json

planning_acceptance:
  trackability_report: results/planning/single_obstacle_astar_awff/metrics/trackability_report.json
  require_local_planning: true
  require_ego_optimizer: true
  min_replan_count: 1
  min_truth_obstacles: 20
  min_known_obstacles_final: 10
  min_obstacle_distance_m: 0.55
  require_collision_free: true
  local_window_radius_m: 2.5
  notes: "规划器仅使用局部感知窗口内已发现障碍，未知真值障碍只用于环境显示和碰撞评价。"

result:
  raw_file: results/planning/single_obstacle_astar_awff/sunray150_planning_open_blocks_linear_mpc_sysblock/raw/sunray150_planning_open_blocks_linear_mpc_sysblock.csv
  metrics_file: results/planning/single_obstacle_astar_awff/sunray150_planning_open_blocks_linear_mpc_sysblock/metrics/sunray150_planning_open_blocks_linear_mpc_sysblock.json
  figure_dir: results/planning/single_obstacle_astar_awff/sunray150_planning_open_blocks_linear_mpc_sysblock/figures
  replay_file: results/planning/single_obstacle_astar_awff/sunray150_planning_open_blocks_linear_mpc_sysblock/replay/sunray150_planning_open_blocks_linear_mpc_sysblock.json
  mcp_log: results/planning/single_obstacle_astar_awff/sunray150_planning_open_blocks_linear_mpc_sysblock/logs/sysplorer_sunray150_planning_open_blocks_linear_mpc_sysblock_20260515.jsonl
  variable_overrides:
    x_ref: planningReference.position_command[1]
    y_ref: planningReference.position_command[2]
    z_ref: planningReference.position_command[3]
  extra_variables:
    z_ref_rate: planningReference.z_ref_rate
    yaw_ref: planningReference.yaw_ref

planning_display:
  collision_clearance_m: 0.55
