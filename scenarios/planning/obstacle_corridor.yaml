experiment_id: planning_obstacle_corridor
scene_id: obstacle_corridor
controller_id: improved_pid
planner_id: astar_min_snap
priority: P2

planner:
  params_file: planners/waypoint/default.yaml
  type: astar_grid_min_snap
  start: [0.0, 0.0, 1.5]
  goal: [8.0, 0.0, 2.0]
  yaw_mode: face_velocity
  astar:
    grid_resolution_m: 0.5
    neighbor_type: 26
    heuristic: euclidean
    tie_breaker: 1.001
    max_iterations: 100000
    collision_sample_step_m: 0.1
  map:
    bounds:
      x: [-1.0, 9.0]
      y: [-3.0, 3.0]
      z: [0.5, 3.5]
    safety_margin_m: 0.35
    obstacles:
      - type: box
        min: [3.0, -0.8, 0.5]
        max: [4.8, 0.8, 3.0]
      - type: sphere
        center: [6.0, 1.2, 2.0]
        radius: 0.6

model:
  source_package: QuadrotorModel
  model_name: QuadrotorModel.Examples.Example3
  model_path_hint: QuadrotorModel/package.mo
  replacement_component: climbePath
  realization: offline_astar_reference_and_replay

simulation:
  start_time_s: 0.0
  stop_time_s: 14.0
  step_size_s: 0.02

reference:
  type: astar_min_snap
  file: results/raw/reference_planning_obstacle_corridor.csv

result:
  raw_file: results/raw/reference_planning_obstacle_corridor.csv
  metrics_file: results/metrics/planning_obstacle_corridor.json
  path_file: results/raw/path_planning_obstacle_corridor.csv
  replay_file: results/replay/planning_obstacle_corridor.json
  replay_html: results/replay_html/planning_obstacle_corridor.html
