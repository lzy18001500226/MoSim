experiment_id: safety_filter_guard
scene_id: safety_filter_guard
controller_id: nmpc_indi_l1
priority: P1

model:
  source_package: QuadrotorModel
  model_name: QuadrotorModel.Examples.Example3
  model_path_hint: QuadrotorModel/package.mo
  replacement_component: controller3_2
  realization: offline_safety_filter_demo

simulation:
  start_time_s: 0.0
  stop_time_s: 16.0
  step_size_s: 0.02

reference:
  type: unsafe_nominal_path
  file: results/raw/reference_safety_filter_guard.csv

unsafe_reference:
  waypoints:
    - [0.0, 0.0, 1.2]
    - [2.0, 0.0, 0.25]
    - [4.0, 0.0, 0.18]
    - [5.2, 0.1, 1.0]
    - [7.0, 1.0, 1.4]
  yaw_mode: face_velocity

safety_filter:
  min_altitude_m: 0.8
  max_velocity_m_s: 2.2
  max_acceleration_m_s2: 3.5
  obstacle_safety_margin_m: 0.45
  obstacle_push_gain: 0.9
  smoothing_alpha: 0.35
  obstacles:
    - type: sphere
      center: [4.9, 0.0, 1.0]
      radius: 0.6

result:
  raw_file: results/raw/safety_filter_guard.csv
  metrics_file: results/metrics/safety_filter_guard.json
  event_log: results/logs/safety_filter_guard_events.jsonl
  replay_file: results/replay/safety_filter_guard.json
  replay_html: results/replay_html/safety_filter_guard.html
