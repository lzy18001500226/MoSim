<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #465a69; }
      .box { fill: #ffffff; stroke: #2f4858; stroke-width: 2; rx: 8; }
      .box2 { fill: #f2f7f8; stroke: #2f4858; stroke-width: 2; rx: 8; }
      .sat { fill: #fff4e6; stroke: #b66a00; stroke-width: 2; rx: 8; }
      .sum { fill: #eaf4ff; stroke: #2b6cb0; stroke-width: 2; }
      .text { font: 15px Arial, sans-serif; fill: #17202a; }
      .small { font: 13px Arial, sans-serif; fill: #465a69; }
      .mono { font: 13px Consolas, monospace; fill: #17202a; }
      .line { stroke: #2f4858; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #6b7c86; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7a8790; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#fbfcfd"/>
  <text x="42" y="48" class="title">AWFF PID 控制器结构图</text>
  <text x="42" y="76" class="subtitle">QuadrotorExperiments.AntiWindupFeedforwardController，替换官方 controller3_2，端口保持兼容</text>

  <rect x="40" y="110" width="170" height="96" class="box2"/>
  <text x="58" y="142" class="text">position_command[3]</text>
  <text x="58" y="166" class="small">x_ref, y_ref, z_ref</text>
  <text x="58" y="188" class="small">ClimbPath 输出</text>

  <rect x="40" y="258" width="170" height="96" class="box2"/>
  <text x="58" y="290" class="text">position[3]</text>
  <text x="58" y="314" class="small">x, y, z</text>
  <text x="58" y="336" class="small">Sensors.PosMea</text>

  <rect x="40" y="460" width="170" height="96" class="box2"/>
  <text x="58" y="492" class="text">angle[3]</text>
  <text x="58" y="516" class="small">roll, pitch, yaw</text>
  <text x="58" y="538" class="small">Sensors.AngleMea</text>

  <circle cx="285" cy="208" r="26" class="sum"/>
  <text x="277" y="214" class="text">Σ</text>
  <text x="249" y="246" class="small">e = ref - pos</text>

  <rect x="350" y="125" width="170" height="70" class="box"/>
  <text x="370" y="154" class="text">XY 位置 PID</text>
  <text x="370" y="177" class="mono">Kp=1.65, Kd=1.0</text>

  <rect x="350" y="232" width="170" height="82" class="box"/>
  <text x="370" y="262" class="text">Z 高度 PID</text>
  <text x="370" y="285" class="mono">Kp=8, Ki=6, Kd=4</text>
  <text x="370" y="306" class="small">一阶导数滤波</text>

  <rect x="350" y="345" width="170" height="76" class="sat"/>
  <text x="370" y="374" class="text">条件积分抗饱和</text>
  <text x="370" y="397" class="small">饱和且误差同向时暂停积分</text>

  <rect x="560" y="232" width="165" height="82" class="box"/>
  <text x="580" y="262" class="text">Z 参考前馈</text>
  <text x="580" y="285" class="mono">0.35 * dz_ref/dt</text>
  <text x="580" y="306" class="small">reference_filter_T=0.20</text>

  <rect x="560" y="125" width="165" height="70" class="sat"/>
  <text x="580" y="154" class="text">姿态参考限幅</text>
  <text x="580" y="177" class="mono">|roll/pitch| ≤ 12 deg</text>

  <circle cx="790" cy="200" r="26" class="sum"/>
  <text x="782" y="206" class="text">Σ</text>
  <text x="742" y="238" class="small">姿态误差</text>

  <rect x="850" y="145" width="170" height="90" class="box"/>
  <text x="870" y="176" class="text">姿态 PD</text>
  <text x="870" y="199" class="mono">roll/pitch: Kp=14.142</text>
  <text x="870" y="220" class="mono">Kd=1.70, yaw Kp=5</text>

  <rect x="850" y="270" width="170" height="78" class="sat"/>
  <text x="870" y="300" class="text">控制量限幅</text>
  <text x="870" y="323" class="mono">att/yaw ≤ 6.5</text>

  <rect x="850" y="392" width="170" height="88" class="box"/>
  <text x="870" y="424" class="text">混控矩阵</text>
  <text x="870" y="447" class="mono">T, roll, pitch, yaw</text>
  <text x="870" y="468" class="small">→ u1, u2, u3, u4</text>

  <rect x="1080" y="385" width="160" height="92" class="sat"/>
  <text x="1100" y="418" class="text">电机命令限幅</text>
  <text x="1100" y="442" class="mono">|u_i| ≤ 20</text>
  <text x="1100" y="464" class="small">输出 y,y1,y2,y3</text>

  <rect x="1080" y="540" width="160" height="82" class="box2"/>
  <text x="1100" y="572" class="text">官方模型接口</text>
  <text x="1100" y="596" class="small">Actuator.u[1..4]</text>

  <path d="M 210 158 C 240 158 250 182 261 195" class="line"/>
  <path d="M 210 306 C 240 306 250 232 261 218" class="line"/>
  <path d="M 311 198 C 330 178 330 160 350 160" class="line"/>
  <path d="M 311 218 C 330 240 330 273 350 273" class="line"/>
  <path d="M 435 314 L 435 345" class="thin"/>
  <path d="M 520 273 L 560 273" class="line"/>
  <path d="M 520 160 L 560 160" class="line"/>
  <path d="M 725 160 C 750 160 760 182 767 192" class="line"/>
  <path d="M 210 508 C 520 508 610 220 764 205" class="line"/>
  <path d="M 816 200 L 850 190" class="line"/>
  <path d="M 935 235 L 935 270" class="line"/>
  <path d="M 935 348 L 935 392" class="line"/>
  <path d="M 1020 436 L 1080 431" class="line"/>
  <path d="M 1160 477 L 1160 540" class="line"/>
  <path d="M 642 314 C 700 350 780 390 850 430" class="line"/>
  <path d="M 350 383 C 610 383 700 310 850 310" class="dash"/>

  <text x="58" y="650" class="small">证据说明：该图描述当前 Modelica 控制器实现的信号流，不是 Sysblock 自动截图。真实仿真证据仍以 check_model、simulate_model、raw CSV、metrics 和 MCP 日志为准。</text>
</svg>
