# Legacy direct-Responses backend. Model Studio now reads
# model_studio_codex_cli_v1.toml through codex_cli_agent_server.py.
schema = "mosim.model_studio_agent.v1"
version = 1
scope = "Legacy direct-Responses backend retained for migration tests. It is not the active Model Studio assistant path."

[service]
host = "127.0.0.1"
port = 8765

[provider]
model_provider = "OpenAI"
base_url = "https://www.yclsb.beer/v1"
base_url_env = "MOSIM_AGENT_BASE_URL"
api_key_env = "MOSIM_OPENAI_API_KEY"
fallback_api_key_env = "OPENAI_API_KEY"
model = "gpt-5.5"
review_model = "gpt-5.5"
model_reasoning_effort = "xhigh"
disable_response_storage = true
network_access = "enabled"

[limits]
max_question_chars = 6000
max_answer_chars = 2400
max_tool_rounds = 4
max_tools_per_turn = 6
request_timeout_s = 60

[safety]
read_only = true
allow_model_execution = false
allow_configuration_write = false
allow_runtime_command = false
allow_external_file_paths = false
audit_log_content = false
