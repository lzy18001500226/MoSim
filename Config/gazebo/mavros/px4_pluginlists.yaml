# Project-owned MAVROS plugin profile for the Sunray ROS1/PX4 Gazebo lane.
#
# This keeps the Sunray baseline plugin surface, but enables home_position so
# the GPS/EKF boot gate can observe PX4's authoritative home state through
# MAVROS. It does not publish control setpoints or alter PX4 estimator logic.
plugin_blacklist:
  # common
  - 3dr_radio
  - actuator_control
  - adsb
  - altitude
  - cam_imu_sync
  - camera
  - cellular_status
  - companion_process_status
  - debug_value
  - esc_status
  - esc_telemetry
  - fake_gps
  - ftp
  - geofence
  - gps_input
  - gps_rtk
  - gimbal_control
  - guided_target
  - hil
  # MAVROS applies this blacklist before the whitelist. Keep home_position
  # out of this section so the passive GPS/EKF gate can subscribe to it.
  - landing_target
  - log_transfer
  - mag_calibration_status
  - mocap_pose_estimate
  - mount_control
  - nav_controller_output
  - obstacle_distance
  - onboard_computer_status
  - play_tune
  - px4flow
  - rallypoint
  - rangefinder
  - safety_area
  - setpoint_accel
  - setpoint_position
  - setpoint_trajectory
  - setpoint_velocity
  - terrain
  - trajectory
  - tunnel
  - vfr_hud
  - vibration
  - wind_estimation
  - waypoint
  - wheel_odometry

plugin_whitelist:
  - command
  - distance_sensor
  - global_position
  - gps_status
  - home_position
  - imu
  - local_position
  - manual_control
  - odom
  - param
  - rc_io
  - setpoint_raw
  - setpoint_attitude
  - sys_status
  - sys_time
  - vision_pose_estimate
  - vision_speed_estimate
