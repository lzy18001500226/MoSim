controller_id: awff_complete_system
type: complete_system_awff_bridge
priority: P1-B

description: >
  Complete-system scenario controller contract for Sunray150 hardware,
  failsafe, and mission-state simulations. The executable controller is the
  project AWFF full-controller equation Sysblock embedded as component
  `controller`; this file exists so system scenarios have the same controller
  traceability and QA checks as official, robustness, planning, and formation
  scenarios.

implementation_status:
  current_mworks_model:
    - MoSimQuadrotorModel.System.Architecture.Sunray150CompleteSystemBatteryLowSysblock
    - MoSimQuadrotorModel.System.Architecture.Sunray150CompleteSystemGeofenceBreachSysblock
    - MoSimQuadrotorModel.System.Architecture.Sunray150CompleteSystemGPSDropoutSysblock
    - MoSimQuadrotorModel.System.Architecture.Sunray150CompleteSystemMissionFailureSysblock
    - MoSimQuadrotorModel.System.Architecture.Sunray150CompleteSystemOffboardLossSysblock
  sysblock_controller: AWFF_FullControllerEquation_Sysblock
  scope: complete-system failsafe and event-log validation

model_interface:
  replacement_component: controller
  compatible_source_model: AWFF_FullControllerEquation_Sysblock
  implementation_target:
    - Sunray150 complete-system Sysplorer wrapper
    - Failsafe/event-log scenarios under Config/scenarios/system
  inputs:
    reference_position: mission_computer.reference_position
    measured_position: airframe.position
    attitude: airframe.attitude
    failsafe_state: system_failsafe_status_code
  outputs:
    motor_1: controller.motor_command[1]
    motor_2: controller.motor_command[2]
    motor_3: controller.motor_command[3]
    motor_4: controller.motor_command[4]
  required_result_variables:
    - airframe.position[1]
    - airframe.position[2]
    - airframe.position[3]
    - airframe.attitude[1]
    - airframe.attitude[2]
    - airframe.attitude[3]
    - mission_computer.reference_position[1]
    - mission_computer.reference_position[2]
    - mission_computer.reference_position[3]
    - controller.motor_command[1]
    - controller.motor_command[2]
    - controller.motor_command[3]
    - controller.motor_command[4]
    - system_failsafe_event_code

acceptance:
  system_scenarios:
    required: check_model, simulate_model, raw CSV, metrics JSON/CSV, event_log JSON
  event_log:
    script: Scripts/results/generate_event_log.py
    required: preserves failsafe event codes 60-64 and does not collapse return/failsafe rows to DEGRADED_NAV
