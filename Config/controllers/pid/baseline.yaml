controller_id: pid_baseline
type: official_pid
priority: P0

description: Official MWORKS quadrotor PID baseline used as the comparison anchor.

model_interface:
  source_model: MoSimQuadrotorModel.Vehicle.Blocks.Controller.Controller
  replacement_component: controller3_2
  replacement_policy: preserve_official_baseline
  inputs:
    position: sensors1_1.PosMea
    attitude: sensors1_1.AngleMea
    position_command: climbePath.position_command
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

limits:
  roll_max_rad: 0.61
  pitch_max_rad: 0.61
  yaw_rate_max_rad_s: 2.0
  motor_cmd_min: 0.0
  motor_cmd_max: 1.0

logging:
  required_signals:
    - controller_mode
    - thrust
    - torque_x
    - torque_y
    - torque_z
    - u1
    - u2
    - u3
    - u4
