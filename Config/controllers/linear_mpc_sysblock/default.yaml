controller_id: linear_mpc_sysblock
type: sysblock_linear_mpc_outer_loop_indi_inner_loop
priority: P1

description: >
  Project Sysblock controller that replaces the PID-style position outer loop
  with a finite-horizon linear MPC-style outer loop. The current P1 version
  adds bounded L1-inspired residual feedforward to reduce slow model mismatch,
  keeps the verified controller3_2 motor-command interface, and uses an
  INDI-like attitude inner loop and the existing quadrotor mixer.

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1LinearMPCSysblockClosedLoop
    - QuadrotorExperiments.Example2LinearMPCSysblockClosedLoop
    - QuadrotorExperiments.Example3LinearMPCSysblockClosedLoop
  sysblock_controller: AWFF_LinearMPCOuterLoopControllerEquation_Sysblock
  graphical_sysblock_counterpart:
    package_file: Models/QuadrotorControllerBlocks/AWFF_InnovationGraphicalControllers.mo
    controller_model: AWFF_InnovationGraphicalControllers.AWFF_LinearMPCControllerGraphical_Sysblock
    outer_loop_model: AWFF_InnovationGraphicalControllers.LinearMPCOuterLoopBlock
    static_contract: Results/model_checks/awff_sysblock/graphical_contract/graphical_awff_sysblock_contract_20260512_linear_mpc_gate.json
    mcp_summary: Results/model_checks/awff_sysblock/logs/sysplorer_innovation_graphical_linear_mpc_check_20260512_summary.json
    mcp_log: Results/model_checks/awff_sysblock/logs/sysplorer_innovation_graphical_linear_mpc_check_20260512.jsonl
    verification_level: load_file_check_model
    note: >
      Graphical Sysblock counterpart expresses terminal-error prediction,
      error differencing, L1 residual low-pass compensation, z-axis integration,
      acceleration/attitude/thrust saturation, INDI-like attitude loop, and
      motor mixing. Full-plant performance evidence still uses the Equation
      bridge because graphical Sysblock embedding in the Modelica plant has a
      current internal multi-input-port parsing limitation.
  verification_scope: >
    Full MWORKS_MCP evidence is complete for official Example1, Example2 helix,
    Example3 figure-8, mass +20%, and lateral wind gust. These scenarios pass
    the quality gate against the corresponding L1+INDI or L1 residual baseline.
  limitation: >
    This first implementation is a constrained finite-horizon linear predictive
    control equivalent using explicit terminal-error, residual compensation,
    and saturation terms. It is not yet an online quadratic-program MPC solver.
    In the rotor-1 85% efficiency-loss scene, the pure outer-loop controller is
    a boundary case and needs an actuator allocation layer to pass the quality gate.

