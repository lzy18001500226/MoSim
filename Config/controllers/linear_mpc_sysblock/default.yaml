model_interface:
  replacement_component: controller3_2
  compatible_source_model:
    - AWFF_FullControllerEquation_Sysblock
    - AWFF_INDIControllerEquation_Sysblock
  implementation_target:
    - Sysblock controller component
    - Example1 step/climb closed-loop wrapper
    - Example2 helix closed-loop wrapper
    - Example3 figure-8 closed-loop wrapper
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder for current validation
    roll_mea: sensors1_1.AngleMea[1]
    pitch_mea: sensors1_1.AngleMea[2]
    yaw_mea: sensors1_1.AngleMea[3]
    yaw_ref: zero-order placeholder
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

linear_mpc_outer_loop:
  sample_time_s: 0.05
  horizon_steps: 20
  horizon_s: 1.0
  lateral:
    mpc_kp_xy: 1.65
    mpc_kd_xy: 1.00
    mpc_terminal_gain_xy: 0.04
    acceleration_limit_mps2: 2.5
    attitude_scale: 0.1
    roll_pitch_limit_rad: 12 / 57.3
  altitude:
    mpc_kp_z: 8.0
    mpc_ki_z: 6.0
    mpc_kd_z: 4.0
    mpc_terminal_gain_z: 0.03
    reference_feedforward_z: 0.35
    thrust_limit: 20.0
  residual_feedforward:
    type: l1_inspired_low_pass_residual
    l1_model_decay: 1.25
    l1_filter_T: 0.20
    l1_gain_xy: 0.32
    l1_gain_z: 0.35
    l1_comp_limit_xy: 2.0
    l1_comp_limit_z: 2.0

inner_loop:
  type: indi_like_attitude_loop
  attitude_feedback_blend: 1.0
  angular_accel_filter_T: 0.08
  indi_increment_limit: 0.15

acceptance:
  full_nominal:
    scenario_file: Config/scenarios/official/example1_linear_mpc_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  full_helix:
    scenario_file: Config/scenarios/official/example2_linear_mpc_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  full_figure8:
    scenario_file: Config/scenarios/official/example3_linear_mpc_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  mass20_robust:
    scenario_file: Config/scenarios/robustness/example1_mass20_linear_mpc_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  wind_gust_robust:
    scenario_file: Config/scenarios/robustness/example1_wind_gust_linear_mpc_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
  rotor1_loss15_boundary:
    scenario_file: Config/scenarios/robustness/example1_rotor1_loss15_linear_mpc_sysblock.yaml
    expected_status: needs_iteration_without_fault_allocation
