controller_id: awff_indi_sysblock
type: sysblock_awff_l1_residual_outer_loop_indi_like_attitude_inner_loop
priority: P1

description: >
  Project Sysblock controller that keeps the verified AWFF stabilizing path,
  adds L1-inspired residual compensation in the position/altitude outer loop,
  and adds a bounded INDI-like angular-acceleration correction in the attitude
  inner loop. It preserves the controller3_2 external interface used by the
  official plant wrappers.

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1INDISysblockClosedLoop
    - QuadrotorExperiments.Example2INDISysblockClosedLoop
    - QuadrotorExperiments.Example2HelixTunedINDISysblockClosedLoop
    - QuadrotorExperiments.Example3INDISysblockClosedLoop
  sysblock_controller: AWFF_INDIControllerEquation_Sysblock
  verification_scope: Example1 full climb, Example2 helix-tuned climb, and Example3 figure-eight validation complete for the combined L1-inspired + INDI-like branch
  limitation: >
    This is an engineering L1-inspired + INDI-like controller using only the
    available position and attitude-angle measurement interface. It is not yet
    a full actuator-dynamics-aware INDI implementation with direct angular-rate
    gyro inputs or identified control effectiveness, and it is not a formal
    L1 adaptive-control proof. Treat results as P1 innovation-controller
    validation with explicit ablation evidence, not as final theory proof.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: AWFF_FullControllerEquation_Sysblock
  implementation_target:
    - Sysblock controller component
    - Project-owned Example1 closed-loop wrapper
    - Project-owned Example2 helix closed-loop wrapper
    - Project-owned Example3 figure-eight closed-loop wrapper
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder
    attitude: sensors1_1.AngleMea
    yaw_ref: zero-order placeholder
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

indi_attitude_inner_loop:
  l1_model_decay: 1.25
  l1_filter_T: 0.20
  l1_gain_xy: 0.32
  l1_gain_z: 0.35
  l1_comp_limit_xy: 2.0
  l1_comp_limit_z: 2.0
  attitude_rate_filter_T: 0.035
  angular_accel_filter_T: 0.08
  indi_roll_gain: 0.015
  indi_pitch_gain: 0.015
  indi_yaw_gain: 0.005
  indi_increment_limit: 0.15
  attitude_feedback_blend: 1.00
  stability_note: >
    Earlier aggressive incremental gains caused full-run divergence on Example1,
    and replacing AWFF attitude-error derivative with measured attitude-rate
    feedback increased Example3 RMSE. The current setting keeps the verified
    AWFF attitude-error derivative path as the primary stabilizing path and
    applies bounded INDI-like angular-acceleration correction as a conservative
    innovation layer.

acceptance:
  full_example1:
    scenario_file: Config/scenarios/official/example1_awff_indi_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
    target_quality: pass
  full_example3:
    scenario_file: Config/scenarios/official/example3_awff_indi_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON
    target_quality: pass
  full_example2_helix_tuned:
