controller_id: l1_online_fault_allocation_sysblock
type: sysblock_l1_residual_online_efficiency_estimated_fault_allocation
priority: P1-B

description: >
  Project Sysblock controller for rotor efficiency degradation with a residual-
  driven online rotor-1 efficiency estimate. It keeps the same L1 residual
  compensation core as l1_fault_allocation_sysblock, but replaces the known
  eta=0.85 input assumption with an internal low-pass eta_hat estimator and
  exposes eta_hat as a diagnostic output.

implementation_status:
  current_mworks_model:
    - MoSimQuadrotorModel.Robustness.Scenarios.RotorLoss.Example1Rotor1Loss15L1OnlineFaultAllocationSysblockClosedLoop
  sysblock_controller: AWFF_L1OnlineFaultAllocationControllerEquation_Sysblock
  verification_scope: real MWORKS_MCP 50 s full run complete for rotor-1 85% efficiency degradation; quality_status pass
  limitation: >
    This is an online-estimation prototype, not a complete multi-rotor fault
    isolation system. The estimator is tuned for the current Example1 rotor-1
    efficiency-loss signature and must be extended before claiming arbitrary
    actuator fault diagnosis.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: AWFF_L1FaultAllocationControllerEquation_Sysblock
  implementation_target:
    - Sysblock controller component
    - Project-owned rotor-1 85% efficiency degradation Example1 closed-loop wrapper
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder
    attitude: sensors1_1.AngleMea
    yaw_ref: zero-order placeholder
  outputs:
    motor_1: y, allocation compensated by eta_hat
    motor_2: y1
    motor_3: y2
    motor_4: y3
    diagnostic_eta_hat: eta_hat
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3
    - controller3_2.eta_hat

online_fault_estimator:
  affected_rotor: rotor_1
  target_component: quadChassisTest17_1.gain2.k
  nominal_lift_gain: 0.000584
  degraded_lift_gain: 0.0004964
  true_efficiency_for_validation: 0.85
  eta_min_est: 0.50
  eta_max_est: 1.00
  eta_est_filter_T: 5.0
  eta_signature_deadband: 0.015
  eta_signature_gain: 2.65
  rotor1_allocation_blend: 0.52
  diagnostic_signal: controller3_2.eta_hat
  compensation: motor_1_command_multiplied_by_1_plus_blend_times_inverse_eta_hat_error_then_saturated

acceptance:
  rotor_degradation:
    scenario_file: Config/scenarios/robustness/example1_rotor1_loss15_l1_online_fault_allocation_sysblock.yaml
    required: check_model, simulate_model, result_manager, eta_hat raw column, metrics, figures, replay JSON
    target_quality: pass_or_better_than_l1_residual

verified_evidence:
  source: MWORKS_MCP
  rotor1_loss15_full:
    scenario_file: Config/scenarios/robustness/example1_rotor1_loss15_l1_online_fault_allocation_sysblock.yaml
    model_name: MoSimQuadrotorModel.Robustness.Scenarios.RotorLoss.Example1Rotor1Loss15L1OnlineFaultAllocationSysblockClosedLoop
    raw_file: Results/robustness/rotor1_loss15_example1/robust_rotor1_loss15_example1_l1_online_fault_allocation_sysblock/raw/robust_rotor1_loss15_example1_l1_online_fault_allocation_sysblock.csv
    metrics_file: Results/robustness/rotor1_loss15_example1/robust_rotor1_loss15_example1_l1_online_fault_allocation_sysblock/metrics/robust_rotor1_loss15_example1_l1_online_fault_allocation_sysblock.json
    mcp_log: Results/robustness/rotor1_loss15_example1/robust_rotor1_loss15_example1_l1_online_fault_allocation_sysblock/logs/sysplorer_robust_rotor1_loss15_example1_l1_online_fault_allocation_sysblock_20260511.jsonl
    row_count: 5001
