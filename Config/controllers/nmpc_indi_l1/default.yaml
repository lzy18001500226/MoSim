controller_id: nmpc_indi_l1
type: qp_nmpc_outer_indi_inner_l1_cbf_safety_mode_manager
priority: P1-D

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1QPNMPCSafetySysblockClosedLoop
  sysblock_controller: AWFF_QPNMPCSafetyController_Sysblock
  sysblock_controller_file: Models/QuadrotorControllerBlocks/AWFF_QPNMPCSafetyController_Sysblock.mo
  verification_scope: >
    First integrated implementation of fixed-iteration constrained QP MPC,
    NMPC-style nonlinear tilt correction, CBF-style safety projection,
    controller mode output, return/land references, and event_code logging.
    Full MWORKS_MCP evidence is tracked by
    Config/scenarios/official/example1_qp_nmpc_safety_sysblock.yaml.
  limitation: >
    The QP solver is an embedded fixed-iteration projected-gradient/ADMM-style
    implementation suitable for Sysblock execution. It is an online constrained
    optimizer, but not a general-purpose dense QP library. The NMPC layer is a
    nonlinear correction and projection layer around the predictive outer loop,
    not a full multiple-shooting nonlinear programming solver.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: QuadrotorModel.Blocks.Controller.Controller
  implementation_target:
    - Sysblock subsystem
    - external function prototype
  inputs:
    position: sensors1_1.PosMea
    attitude: sensors1_1.AngleMea
    position_command: climbePath.position_command
    velocity: derived_from_position
    angular_rate: optional_sensor_or_derivative
    disturbance_event: scenario.disturbance
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
    controller_mode: controller_mode
    safety_active: safety_active
    event_code: event_code
    return_ref_x: return_ref_x
    return_ref_y: return_ref_y
    return_ref_z: return_ref_z
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3
    - controller3_2.controller_mode
    - controller3_2.safety_active
    - controller3_2.event_code

outer_loop:
  type: fixed_iteration_qp_mpc_with_nmpc_projection
  horizon_steps: 20
  dt: 0.05
  q_position: [10.0, 10.0, 14.0]
  q_velocity: [2.0, 2.0, 3.0]
  r_acceleration: [0.15, 0.15, 0.25]
  velocity_limit_m_s: 6.0
  acceleration_limit_m_s2: 5.0
  qp_solver:
    method: projected_gradient_admm_style
    fixed_iterations: 2
    rho: 1.20
    gradient_step: 0.50
    r_motor: 0.0
  nmpc_projection:
    nonlinear_tilt_softening: 0.22
    yaw_cross_axis_coupling: 0.04

indi_inner_loop:
  angular_acc_filter_alpha: 0.85
  control_effectiveness_update: true
  torque_limit_nm: [1.5, 1.5, 0.8]

l1_compensation:
  enabled: true
  residual_filter_alpha: 0.90
  compensation_limit_m_s2: 2.0

safety_filter:
  enabled: true
  type: cbf_style_reference_and_command_projection
  roll_max_rad: 0.61
  pitch_max_rad: 0.61
  min_altitude_m: 0.35
  altitude_cbf_gain: 0.25
  motor_cmd_min: -20.0
  motor_cmd_max: 20.0

mode_manager:
  modes:
    1: NORMAL
    2: SAFETY_FILTER_ACTIVE
    3: DEGRADED_RETURN
    4: EMERGENCY_LAND
  safety_error_threshold_m: 0.75
  emergency_error_threshold_m: 1.60
  return_trigger_time_s: 1.0e9
  land_trigger_time_s: 1.0e9
  return_reference_m: [0.0, 0.0, 1.0]
  landing_altitude_m: 0.15

logging:
  required_signals:
    - controller_mode
    - safety_active
    - event_code
    - return_ref_x
    - return_ref_y
    - return_ref_z

acceptance:
  nominal_full:
    scenario_file: Config/scenarios/official/example1_qp_nmpc_safety_sysblock.yaml
    required: check_model, simulate_model, result_manager, raw CSV, metrics, figures, replay JSON, event_log JSON
