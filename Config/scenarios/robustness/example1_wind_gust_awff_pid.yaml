  sine_amplitude_x_N: 0.08
  sine_amplitude_y_N: 0.04
  sine_frequency_Hz: 1.2
  purpose: external_wind_disturbance_robustness

simulation:
  start_time_s: 0.0
  stop_time_s: 50.0
  step_size_s: 0.01
  solver: Dassl
  tolerance: 0.0001

reference:
  type: official_climb_path
  file: Results/official/example1_step/reference_official_example1/raw/reference_official_example1.csv
result:
