experiment_id: robust_wind_gust_example1_awff_pid
scene_id: robust_wind_gust_example1
controller_id: awff_pid
priority: P1
evidence_level: real_sysplorer_mcp_robust_wind_gust_awff

model:
  source_package: MoSimQuadrotorModel
  model_name: MoSimQuadrotorModel.Robustness.Scenarios.Example1WindGustAntiWindupFeedforwardPID
  model_path_hint: Models/MoSimQuadrotorModel/package.mo
  base_model_path_hint: Models/MoSimQuadrotorModel/package.mo
