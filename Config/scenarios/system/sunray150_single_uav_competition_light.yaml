    ki_z: 0.00004
    kp_roll: 0.011
    kd_roll: 0.0022
    kp_pitch: 0.011
    kd_pitch: 0.0022
    kp_yaw: 0.0
    kd_yaw: 0.0
    attitude_command_limit: 0.0038
    command_min: 0.05480
    command_max: 0.05625
    setpoint_timeout_s: 0.35
    max_publish_hz: 20.0
    duration_s: 24.0
    reference_mode: external_planner_setpoint_required
    runtime_gate: bounded_gazebo_truth_position_control_pre_acceptance
    runtime_gate_claim: external_planner_setpoint_to_controller_output_position_control_only_no_final_closed_loop_no_controller_performance
    not_claimed:
