  single_uav_figure8_static_obstacle_pre_acceptance:
    runner_script: Scripts/gazebo/run_sunray150_figure8_obstacle_gate.sh
    reference_script: Scripts/ros/publish_figure8_position_command.py
    tracker_script: Scripts/ros/gazebo_truth_position_controller.py
    eval_script: Scripts/quality/evaluate_figure8_obstacle_gate.py
    output_json: FIGURE8_STATIC_OBSTACLE_GATE.json
    reference_report_json: figure8_position_command.json
    reference_trace_jsonl: figure8_position_command.trace.jsonl
    tracker_report_json: figure8_setpoint_tracker.json
    tracker_trace_jsonl: figure8_setpoint_tracker.trace.jsonl
    result_dir: Results/gazebo_ros2/sunray150_single_uav_figure8_static_obstacle_pre_acceptance
    trajectory:
      frame_id: map
      rate_hz: 20.0
      # Total mission duration. With the phase durations below this gives
      # 64s of figure-8 motion, i.e. two complete 32s loops.
      duration_s: 86.0
      period_s: 32.0
      x_amplitude_m: 0.6
      y_amplitude_m: 0.6
      x_offset_m: 0.0
      y_offset_m: 1.0
      altitude_m: 1.2
      takeoff_s: 7.0
      hold_s: 2.0
      post_figure8_hold_s: 2.0
      land_s: 7.0
      final_hold_s: 2.0
      ground_altitude_m: 0.12
      center_revisit_radius_m: 0.15
      start_delay_s: 2.0
    static_obstacles_xy_radius:
      - [-1.0, 0.0, 0.35]
      - [1.0, 0.0, 0.35]
      - [0.0, 2.2, 0.35]
      - [0.0, -2.2, 0.35]
    tracker:
      duration_s: 108.0
      setpoint_timeout_s: 0.35
      max_publish_hz: 20.0
      takeoff_xy_enable_altitude_m: 0.85
      takeoff_stable_z_error_m: 0.18
      takeoff_reference_ready_z_m: 1.1
      takeoff_stable_max_vz_mps: 0.25
      takeoff_stable_s: 1.0
      integral_limit_m_s: 0.35
      roll_control_sign: -1.0
      pitch_control_sign: 1.0
    evaluation_thresholds:
      min_reference_samples: 100
      min_truth_samples: 100
      min_tracker_samples: 20
      min_xy_track_samples: 50
      min_adapter_samples: 20
      min_duration_s: 8.0
      max_xy_rmse_m: 2.5
      max_xy_error_m: 4.0
      max_z_error_m: 0.85
      max_xy_track_rmse_m: 0.12
      max_xy_track_error_m: 0.25
      min_figure8_phase_samples: 100
      max_figure8_phase_xy_rmse_m: 0.20
      max_figure8_phase_xy_error_m: 0.45
      max_figure8_phase_z_error_m: 0.55
      expected_figure8_span_x_m: 1.2
      expected_figure8_span_y_m: 0.6
      min_truth_span_x_m: 0.9
      min_truth_span_y_m: 0.45
      min_truth_path_length_ratio: 0.8
      min_lobe_fraction: 0.18
      min_center_crossings_x: 2
      min_figure8_trajectory_time_span_s: 35.0
      min_center_revisit_entries: 2
      max_final_altitude_m: 0.20
      max_landing_window_altitude_m: 0.25
      max_landing_window_xy_displacement_m: 0.05
      min_reference_obstacle_clearance_m: 0.35
      min_truth_obstacle_clearance_m: 0.35
    runtime_gate: bounded_single_uav_figure8_static_obstacle_pre_acceptance
    runtime_gate_claim: truth_feedback_setpoint_tracking_and_static_obstacle_clearance_pre_acceptance_no_final_controller_performance
    not_claimed:
      - competition_controller_performance
      - final_closed_loop_acceptance
      - planner_ready
      - fast_lio_localization_success
      - multi_uav_readiness
  single_uav_plant_response_pre_acceptance:
    script: Scripts/quality/evaluate_gazebo_plant_response.py
    output_json: GAZEBO_PLANT_RESPONSE_EVAL.json
    required_evidence:
      - controller_output_fixture.json
      - topic_mosim_sunray150_controller_output_once.txt
      - controller_output_adapter_node.json
      - topic_sunray150_gazebo_command_motor_speed_once.txt
