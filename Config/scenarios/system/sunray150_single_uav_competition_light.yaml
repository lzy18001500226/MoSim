    runtime_gate: bounded_single_uav_controller_output_to_gazebo_plant_response_pre_acceptance
    runtime_gate_claim: measurable_gazebo_pose_response_only_no_hover_no_trajectory_no_closed_loop
    truth_source: gazebo_truth_pose
    min_samples: 20
    min_duration_s: 2.0
    window_fraction: 0.2
    min_window_samples: 5
    min_z_delta_m: 0.05
    min_3d_delta_m: 0.05
    max_early_z_range_warning_m: 0.02
    expected_actuator_count: 4
    not_claimed:
