  single_uav_hover_command_bracket:
    runner_script: Scripts/gazebo/run_sunray150_hover_command_bracket.sh
    eval_script: Scripts/quality/evaluate_gazebo_hover_bracket.py
    output_json: GAZEBO_HOVER_COMMAND_BRACKET_EVAL.json
    result_dir: Results/gazebo_ros2/sunray150_gazebo_ros2_single_uav_hover_command_bracket
    per_sample_gate_profile: single_uav_plant_response_pre_acceptance
    command_type: normalized_motor_speed
    start_gazebo_paused: true
    unpause_after_controller_command: true
    free_flight_gate_note: Start Gazebo paused, publish bounded ControllerOutput, then unpause the world so the bracket measures free-flight thrust scale instead of a vehicle that has already settled onto the ground.
    commands: [0.040, 0.050, 0.055, 0.060, 0.065]
    publish_rate_hz: 5
    publish_times: 5
    timeout_seconds: 20
    theoretical_hover_estimate:
      source_model: Config/gazebo/models/sunray150_assembled/model.sdf
      total_mass_kg: 0.67
      rotor_count: 4
      gravity_m_s2: 9.80665
      motor_constant: 8.54858e-06
      max_rot_velocity: 8000.0
      hover_angular_speed_rad_s: 438.1
      normalized_hover_command: 0.0548
    classification:
      near_hover_abs_z_delta_m: 0.5
      near_hover_max_z_excursion_m: 1.0
      near_hover_max_3d_excursion_m: 2.0
      over_climb_z_delta_m: 1.0
      over_climb_max_z_m: 2.0
      grounded_max_z_delta_m: 0.05
      min_valid_samples: 3
    runtime_gate: bounded_single_uav_gazebo_hover_command_bracket
    runtime_gate_claim: open_loop_thrust_scale_bracket_only_no_closed_loop_no_controller_performance
    not_claimed:
      - hover_success
      - trajectory_tracking
      - planner_ready
      - setpoint_publication
      - closed_loop
      - controller_performance
      - multi_uav_readiness
