 "yaw": 0.0}]}, {"time": 49.050000000000004, "uav": [{"id": "actual", "position": [10.000046395799597, 9.994076030301189, 15.000003440064257], "yaw": 9.30498500759658e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.1, "uav": [{"id": "actual", "position": [10.000042763687818, 9.993806275420933, 15.000003272832013], "yaw": 9.297958211038628e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.15, "uav": [{"id": "actual", "position": [10.000039153901492, 9.993571465972146, 15.000003115460133], "yaw": 9.290942804888232e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.2, "uav": [{"id": "actual", "position": [10.000035575837458, 9.993370408488119, 15.000002964573241], "yaw": 9.283938687880044e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.25, "uav": [{"id": "actual", "position": [10.000032037600192, 9.993201768916235, 15.00000281609986], "yaw": 9.276945847595313e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.300000000000004, "uav": [{"id": "actual", "position": [10.0000285495385, 9.993064490851715, 15.000002669164513], "yaw": 9.269964144225031e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.35, "uav": [{"id": "actual", "position": [10.000025159827716, 9.992961901103424, 15.000002564916505], "yaw": 9.262991263395763e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.4, "uav": [{"id": "actual", "position": [10.000021848753104, 9.99288955664082, 15.000002471311742], "yaw": 9.256028822216247e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.45, "uav": [{"id": "actual", "position": [10.000018623687726, 9.992846184554892, 15.000002386695956], "yaw": 9.249076832807048e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.5, "uav": [{"id": "actual", "position": [10.000015490959653, 9.99283045622425, 15.000002309170016], "yaw": 9.24213533411154e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.550000000000004, "uav": [{"id": "actual", "position": [10.00001245580922, 9.992840993680336, 15.00000223657967], "yaw": 9.235204383515545e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.6, "uav": [{"id": "actual", "position": [10.000009522346287, 9.992876375972658, 15.000002166505244], "yaw": 9.228284048609734e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.65, "uav": [{"id": "actual", "position": [10.000006693507528, 9.99293514553401, 15.000002096251398], "yaw": 9.221374399182947e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.7, "uav": [{"id": "actual", "position": [10.000003971013678, 9.993015814545698, 15.000002022836817], "yaw": 9.214475499524637e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.75, "uav": [{"id": "actual", "position": [10.000001355326821, 9.993116871302762, 15.000001942983973], "yaw": 9.207587401103411e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.800000000000004, "uav": [{"id": "actual", "position": [9.999998880328382, 9.993237862630531, 15.000001876524069], "yaw": 9.200711759024832e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.85, "uav": [{"id": "actual", "position": [9.999996545248198, 9.993377291946867, 15.000001820509372], "yaw": 9.193848685146252e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.9, "uav": [{"id": "actual", "position": [9.999994338645488, 9.993533370160431, 15.000001765404217], "yaw": 9.18699781708558e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 49.95, "uav": [{"id": "actual", "position": [9.999992261355365, 9.99370473450933, 15.000001710578431], "yaw": 9.180159396445527e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}, {"time": 50.0, "uav": [{"id": "actual", "position": [9.99999031339018, 9.993890050302515, 15.00000165549228], "yaw": 9.173333659076021e-05}, {"id": "reference", "position": [10.0, 10.0, 15.0], "yaw": 0.0}]}]};
    const frames = replay.frames || [];
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const scrub = document.getElementById('scrub');
    const playButton = document.getElementById('play');
    const timeLabel = document.getElementById('timeLabel');

    let width = 0;
    let height = 0;
    let scale = 34;
    let frameIndex = 0;
    let playing = true;
    let lastStep = performance.now();

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.floor(window.innerWidth * ratio);
      height = Math.floor(window.innerHeight * ratio);
      canvas.width = width;
      canvas.height = height;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      width = window.innerWidth;
      height = window.innerHeight;
      const bounds = computeBounds();
      const span = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY, bounds.maxZ - bounds.minZ, 1);
      scale = Math.max(18, Math.min(54, Math.min(width, height) / (span * 2.2)));
    }

    function getPosition(frame, index = 0) {
      const uav = frame && frame.uav && frame.uav[index];
      return uav ? uav.position : [0, 0, 0];
    }

    function computeBounds() {
      const values = frames.map(getPosition);
      const xs = values.map(p => p[0]);
      const ys = values.map(p => p[1]);
      const zs = values.map(p => p[2]);
      return {
        minX: Math.min(...xs, -2), maxX: Math.max(...xs, 2),
        minY: Math.min(...ys, -2), maxY: Math.max(...ys, 2),
        minZ: Math.min(...zs, 0), maxZ: Math.max(...zs, 2)
      };
    }

    function project(point) {
      const [x, y, z] = point;
      const cx = width * 0.52;
      const cy = height * 0.58;
      const px = cx + (x - y) * scale * 0.82;
      const py = cy + (x + y) * scale * 0.36 - z * scale * 0.92;
      return [px, py];
    }

    function drawLine3(a, b, color, lineWidth = 1) {
      const pa = project(a);
      const pb = project(b);
      ctx.beginPath();
      ctx.moveTo(pa[0], pa[1]);
      ctx.lineTo(pb[0], pb[1]);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }

    function drawGrid() {
      const size = 16;
      for (let i = -size; i <= size; i += 1) {
        const strong = i === 0;
        drawLine3([-size, i, 0], [size, i, 0], strong ? '#58647a' : '#263044', strong ? 1.5 : 0.8);
        drawLine3([i, -size, 0], [i, size, 0], strong ? '#58647a' : '#263044', strong ? 1.5 : 0.8);
      }
      drawLine3([0, 0, 0], [4, 0, 0], '#ff6b6b', 2);
      drawLine3([0, 0, 0], [0, 4, 0], '#61d394', 2);
      drawLine3([0, 0, 0], [0, 0, 4], '#8fd3ff', 2);
    }

    function drawSphereObstacle(obstacle) {
      const center = obstacle.center || [0, 0, 0];
      const radius = Number(obstacle.radius || 0.5);
      const p = project(center);
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(p[0], p[1], Math.max(8, radius * scale * 0.82), Math.max(5, radius * scale * 0.38), 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 117, 117, 0.22)';
      ctx.strokeStyle = 'rgba(255, 117, 117, 0.92)';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawBoxObstacle(obstacle) {
      const lo = obstacle.min || [0, 0, 0];
      const hi = obstacle.max || [1, 1, 1];
      const v = [
        [lo[0], lo[1], lo[2]], [hi[0], lo[1], lo[2]], [hi[0], hi[1], lo[2]], [lo[0], hi[1], lo[2]],
        [lo[0], lo[1], hi[2]], [hi[0], lo[1], hi[2]], [hi[0], hi[1], hi[2]], [lo[0], hi[1], hi[2]]
      ];
      const edges = [[0,1], [1,2], [2,3], [3,0], [4,5], [5,6], [6,7], [7,4], [0,4], [1,5], [2,6], [3,7]];
      edges.forEach(([a, b]) => drawLine3(v[a], v[b], 'rgba(255, 117, 117, 0.95)', 2));
      const top = [v[4], v[5], v[6], v[7]].map(project);
      ctx.beginPath();
      ctx.moveTo(top[0][0], top[0][1]);
      for (let i = 1; i < top.length; i += 1) ctx.lineTo(top[i][0], top[i][1]);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 117, 117, 0.16)';
      ctx.fill();
    }

    function drawObstacles() {
      const obstacles = replay.obstacles || [];
      obstacles.forEach(obstacle => {
        if (obstacle.type === 'sphere') drawSphereObstacle(obstacle);
        if (obstacle.type === 'box') drawBoxObstacle(obstacle);
      });
    }

    function drawPathForUav(uavIndex, color, lineWidth = 2.2, dash = []) {
      if (frames.length < 2) return;
      ctx.save();
      ctx.setLineDash(dash);
      ctx.beginPath();
      frames.forEach((frame, index) => {
        const p = project(getPosition(frame, uavIndex));
        if (index === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
      ctx.restore();
    }

    function drawPath() {
      drawPathForUav(0, '#8fd3ff', 2.2);
      if ((frames[0]?.uav || []).length > 1) drawPathForUav(1, '#ffd166', 1.8, [6, 6]);
    }

    function drawDrone(position, time) {
      const center = project(position);
      const arm = 26;
      const bob = Math.sin(time * 5) * 2;
      ctx.save();
      ctx.translate(center[0], center[1] + bob);
      ctx.rotate(Math.sin(time * 0.8) * 0.18);

      ctx.strokeStyle = '#dfe9ff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-arm, 0);
      ctx.lineTo(arm, 0);
      ctx.moveTo(0, -arm);
      ctx.lineTo(0, arm);
      ctx.stroke();

      ctx.fillStyle = '#f5f8ff';
      ctx.strokeStyle = '#1b2433';
      ctx.lineWidth = 2;
      roundRect(-17, -11, 34, 22, 5);
      ctx.fill();
      ctx.stroke();

      const rotors = [[-arm, 0], [arm, 0], [0, -arm], [0, arm]];
      for (const [x, y] of rotors) {
        ctx.beginPath();
        ctx.ellipse(x, y, 11, 5, time * 7, 0, Math.PI * 2);
        ctx.fillStyle = '#61ffb5';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.stroke();
      }
      ctx.restore();

      const ground = project([position[0], position[1], 0]);
      ctx.beginPath();
      ctx.moveTo(center[0], center[1]);
      ctx.lineTo(ground[0], ground[1]);
      ctx.strokeStyle = 'rgba(255, 209, 102, 0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(ground[0], ground[1], 12, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 209, 102, 0.35)';
      ctx.fill();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawLabels() {
      ctx.fillStyle = '#bbc6db';
      ctx.font = '12px Arial';
      const x = project([4.2, 0, 0]);
      const y = project([0, 4.2, 0]);
      const z = project([0, 0, 4.2]);
      ctx.fillText('X', x[0], x[1]);
      ctx.fillText('Y', y[0], y[1]);
      ctx.fillText('Z', z[0], z[1]);
    }

    function render(now) {
      requestAnimationFrame(render);
      if (playing && frames.length > 0 && now - lastStep > 33) {
        frameIndex = (frameIndex + 1) % frames.length;
        lastStep = now;
      }
      const frame = frames[frameIndex] || { time: 0 };
      const time = Number(frame.time || 0);
      scrub.value = frameIndex;
      timeLabel.textContent = `${time.toFixed(2)} s`;

      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#101827');
      gradient.addColorStop(1, '#0f1117');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      drawGrid();
      drawObstacles();
      drawPath();
      if ((frame.uav || []).length > 1) {
        const ref = project(getPosition(frame, 1));
        ctx.beginPath();
        ctx.arc(ref[0], ref[1], 5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd166';
        ctx.fill();
      }
      drawDrone(getPosition(frame, 0), time);
      drawLabels();
    }

    playButton.addEventListener('click', () => {
      playing = !playing;
      playButton.textContent = playing ? '暂停' : '播放';
    });

    scrub.addEventListener('input', () => {
      playing = false;
      playButton.textContent = '播放';
      frameIndex = Number(scrub.value);
    });

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(render);
  </script>
