ode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.035663341632903994, -0.0016636484224008801, 2.0025993758985137], "yaw": -0.540419500270584}]}, {"time": 11.5490625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.0327591976265119, -0.001528173888230994, 2.002387703026865], "yaw": -0.5404195002705842}]}, {"time": 11.5690625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.029973171673413238, -0.0013982094073545258, 2.0021846393658747], "yaw": -0.540419500270584}]}, {"time": 11.5890625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.027305979844027318, -0.0012737883835235886, 2.001990237107405], "yaw": -0.5404195002705842}]}, {"time": 11.6090625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.02475833820877135, -0.0011549442204901968, 2.001804548443317], "yaw": -0.5404195002705842}]}, {"time": 11.6290625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.02233096283806464, -0.001041710322006463, 2.001627625565472], "yaw": -0.5404195002705842}]}, {"time": 11.6490625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.020024569802329296, -0.0009341200918246302, 2.001459520665732], "yaw": -0.5404195002705842}]}, {"time": 11.6690625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.01783987517197763, -0.0008322069336964849, 2.001300285935958], "yaw": -0.5404195002705842}]}, {"time": 11.6890625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.015777595017433158, -0.000736004251374335, 2.0011499735680123], "yaw": -0.5404195002705842}]}, {"time": 11.7090625, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.013838445409113075, -0.0006455454486101955, 2.0010086357537555], "yaw": -0.5404195002705842}]}, {"time": 11.71875, "mode": "DISTURBANCE_REJECTION", "fault_type": "none", "eta_min": 1.0, "uav": [{"id": "fault_reference", "position": [0.012943648068476664, -0.0006038043184760294, 2.000943417113695], "yaw": -0.5404195002705842}]}]};
    const frames = replay.frames || [];
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const scrub = document.getElementById('scrub');
    const playButton = document.getElementById('play');
    const timeLabel = document.getElementById('timeLabel');

    let width = 0;
    let height = 0;
    let scale = 34;
    let frameIndex = 0;
    let playing = true;
    let lastStep = performance.now();

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.floor(window.innerWidth * ratio);
      height = Math.floor(window.innerHeight * ratio);
      canvas.width = width;
      canvas.height = height;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      width = window.innerWidth;
      height = window.innerHeight;
      const bounds = computeBounds();
      const span = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY, bounds.maxZ - bounds.minZ, 1);
      scale = Math.max(18, Math.min(54, Math.min(width, height) / (span * 2.2)));
    }

    function getPosition(frame) {
      const uav = frame && frame.uav && frame.uav[0];
      return uav ? uav.position : [0, 0, 0];
    }

    function computeBounds() {
      const values = frames.map(getPosition);
      const xs = values.map(p => p[0]);
      const ys = values.map(p => p[1]);
      const zs = values.map(p => p[2]);
      return {
        minX: Math.min(...xs, -2), maxX: Math.max(...xs, 2),
        minY: Math.min(...ys, -2), maxY: Math.max(...ys, 2),
        minZ: Math.min(...zs, 0), maxZ: Math.max(...zs, 2)
      };
    }

    function project(point) {
      const [x, y, z] = point;
      const cx = width * 0.52;
      const cy = height * 0.58;
      const px = cx + (x - y) * scale * 0.82;
      const py = cy + (x + y) * scale * 0.36 - z * scale * 0.92;
      return [px, py];
    }

    function drawLine3(a, b, color, lineWidth = 1) {
      const pa = project(a);
      const pb = project(b);
      ctx.beginPath();
      ctx.moveTo(pa[0], pa[1]);
      ctx.lineTo(pb[0], pb[1]);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }

    function drawGrid() {
      const size = 16;
      for (let i = -size; i <= size; i += 1) {
        const strong = i === 0;
        drawLine3([-size, i, 0], [size, i, 0], strong ? '#58647a' : '#263044', strong ? 1.5 : 0.8);
        drawLine3([i, -size, 0], [i, size, 0], strong ? '#58647a' : '#263044', strong ? 1.5 : 0.8);
      }
      drawLine3([0, 0, 0], [4, 0, 0], '#ff6b6b', 2);
      drawLine3([0, 0, 0], [0, 4, 0], '#61d394', 2);
      drawLine3([0, 0, 0], [0, 0, 4], '#8fd3ff', 2);
    }

    function drawSphereObstacle(obstacle) {
      const center = obstacle.center || [0, 0, 0];
      const radius = Number(obstacle.radius || 0.5);
      const p = project(center);
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(p[0], p[1], Math.max(8, radius * scale * 0.82), Math.max(5, radius * scale * 0.38), 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 117, 117, 0.22)';
      ctx.strokeStyle = 'rgba(255, 117, 117, 0.92)';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawBoxObstacle(obstacle) {
      const lo = obstacle.min || [0, 0, 0];
      const hi = obstacle.max || [1, 1, 1];
      const v = [
        [lo[0], lo[1], lo[2]], [hi[0], lo[1], lo[2]], [hi[0], hi[1], lo[2]], [lo[0], hi[1], lo[2]],
        [lo[0], lo[1], hi[2]], [hi[0], lo[1], hi[2]], [hi[0], hi[1], hi[2]], [lo[0], hi[1], hi[2]]
      ];
      const edges = [[0,1], [1,2], [2,3], [3,0], [4,5], [5,6], [6,7], [7,4], [0,4], [1,5], [2,6], [3,7]];
      edges.forEach(([a, b]) => drawLine3(v[a], v[b], 'rgba(255, 117, 117, 0.95)', 2));
      const top = [v[4], v[5], v[6], v[7]].map(project);
      ctx.beginPath();
      ctx.moveTo(top[0][0], top[0][1]);
      for (let i = 1; i < top.length; i += 1) ctx.lineTo(top[i][0], top[i][1]);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 117, 117, 0.16)';
      ctx.fill();
    }

    function drawObstacles() {
      const obstacles = replay.obstacles || [];
      obstacles.forEach(obstacle => {
        if (obstacle.type === 'sphere') drawSphereObstacle(obstacle);
        if (obstacle.type === 'box') drawBoxObstacle(obstacle);
      });
    }

    function drawPath() {
      if (frames.length < 2) return;
      ctx.beginPath();
      frames.forEach((frame, index) => {
        const p = project(getPosition(frame));
        if (index === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      });
      ctx.strokeStyle = '#8fd3ff';
      ctx.lineWidth = 2.2;
      ctx.stroke();
    }

    function drawDrone(position, time) {
      const center = project(position);
      const arm = 26;
      const bob = Math.sin(time * 5) * 2;
      ctx.save();
      ctx.translate(center[0], center[1] + bob);
      ctx.rotate(Math.sin(time * 0.8) * 0.18);

      ctx.strokeStyle = '#dfe9ff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-arm, 0);
      ctx.lineTo(arm, 0);
      ctx.moveTo(0, -arm);
      ctx.lineTo(0, arm);
      ctx.stroke();

      ctx.fillStyle = '#f5f8ff';
      ctx.strokeStyle = '#1b2433';
      ctx.lineWidth = 2;
      roundRect(-17, -11, 34, 22, 5);
      ctx.fill();
      ctx.stroke();

      const rotors = [[-arm, 0], [arm, 0], [0, -arm], [0, arm]];
      for (const [x, y] of rotors) {
        ctx.beginPath();
        ctx.ellipse(x, y, 11, 5, time * 7, 0, Math.PI * 2);
        ctx.fillStyle = '#61ffb5';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.stroke();
      }
      ctx.restore();

      const ground = project([position[0], position[1], 0]);
      ctx.beginPath();
      ctx.moveTo(center[0], center[1]);
      ctx.lineTo(ground[0], ground[1]);
      ctx.strokeStyle = 'rgba(255, 209, 102, 0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(ground[0], ground[1], 12, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 209, 102, 0.35)';
      ctx.fill();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawLabels() {
      ctx.fillStyle = '#bbc6db';
      ctx.font = '12px Arial';
      const x = project([4.2, 0, 0]);
      const y = project([0, 4.2, 0]);
      const z = project([0, 0, 4.2]);
      ctx.fillText('X', x[0], x[1]);
      ctx.fillText('Y', y[0], y[1]);
      ctx.fillText('Z', z[0], z[1]);
    }

    function render(now) {
      requestAnimationFrame(render);
      if (playing && frames.length > 0 && now - lastStep > 33) {
        frameIndex = (frameIndex + 1) % frames.length;
        lastStep = now;
      }
      const frame = frames[frameIndex] || { time: 0 };
      const time = Number(frame.time || 0);
      scrub.value = frameIndex;
      timeLabel.textContent = `${time.toFixed(2)} s`;

      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#101827');
      gradient.addColorStop(1, '#0f1117');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      drawGrid();
      drawObstacles();
      drawPath();
      drawDrone(getPosition(frame), time);
      drawLabels();
    }

    playButton.addEventListener('click', () => {
      playing = !playing;
      playButton.textContent = playing ? '暂停' : '播放';
    });

    scrub.addEventListener('input', () => {
      playing = false;
      playButton.textContent = '播放';
      frameIndex = Number(scrub.value);
    });

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(render);
  </script>
