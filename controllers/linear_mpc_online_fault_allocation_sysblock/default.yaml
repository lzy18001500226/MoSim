controller_id: linear_mpc_online_fault_allocation_sysblock
type: sysblock_linear_mpc_outer_loop_online_efficiency_fault_allocation
priority: P1-B

description: >
  Project Sysblock controller that combines the verified LinearMPC-style
  outer loop and INDI-like attitude loop with the online rotor-1 efficiency
  allocation layer used in the fault-allocation branch. It is intended for
  actuator-degradation scenes where pure outer-loop compensation is not enough.

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1Rotor1Loss15LinearMPCOnlineFaultAllocationSysblockClosedLoop
  sysblock_controller: AWFF_LinearMPCOnlineFaultAllocationController_Sysblock
  verification_scope: >
    Real MWORKS_MCP 50 s full run is complete for rotor-1 85% efficiency
    degradation. The combined LinearMPC + online allocation controller passes
    the quality gate against the pure LinearMPC boundary case.
  limitation: >
    This is a rotor-1 online allocation prototype. It should not be described
    as general multi-rotor fault isolation until the multi-fault branch is
    integrated and validated.

model_interface:
  replacement_component: controller3_2
  compatible_source_model:
    - AWFF_LinearMPCOuterLoopControllerEquation_Sysblock
    - AWFF_L1OnlineFaultAllocationControllerEquation_Sysblock
  implementation_target:
    - Sysblock controller component
    - Project-owned rotor-1 85% efficiency degradation Example1 closed-loop wrapper
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder
    attitude: sensors1_1.AngleMea
    yaw_ref: zero-order placeholder
  outputs:
    motor_1: y, LinearMPC command multiplied by online eta_hat allocation gain
    motor_2: y1
    motor_3: y2
    motor_4: y3
    diagnostic_eta_hat: eta_hat
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3
    - controller3_2.eta_hat

online_fault_estimator:
  affected_rotor: rotor_1
  target_component: quadChassisTest17_1.gain2.k
  nominal_lift_gain: 0.002
  degraded_lift_gain: 0.0017
  true_efficiency_for_validation: 0.85
  eta_min_est: 0.50
  eta_max_est: 1.00
  eta_est_filter_T: 5.0
  eta_signature_deadband: 0.015
  eta_signature_gain: 2.65
  rotor1_allocation_blend: 0.52
  diagnostic_signal: controller3_2.eta_hat

acceptance:
  rotor_degradation:
    scenario_file: scenarios/robustness/example1_rotor1_loss15_linear_mpc_online_fault_allocation_sysblock.yaml
    required: check_model, simulate_model, result_manager, eta_hat raw column, metrics, figures, replay JSON
    target_quality: pass_or_better_than_linear_mpc_without_fault_allocation

verified_evidence:
  source: MWORKS_MCP
  rotor1_loss15_full:
    scenario_file: scenarios/robustness/example1_rotor1_loss15_linear_mpc_online_fault_allocation_sysblock.yaml
    model_name: QuadrotorExperiments.Example1Rotor1Loss15LinearMPCOnlineFaultAllocationSysblockClosedLoop
    raw_file: results/robustness/rotor1_loss15_example1/robust_rotor1_loss15_example1_linear_mpc_online_fault_allocation_sysblock/raw/robust_rotor1_loss15_example1_linear_mpc_online_fault_allocation_sysblock.csv
    metrics_file: results/robustness/rotor1_loss15_example1/robust_rotor1_loss15_example1_linear_mpc_online_fault_allocation_sysblock/metrics/robust_rotor1_loss15_example1_linear_mpc_online_fault_allocation_sysblock.json
    mcp_log: results/robustness/rotor1_loss15_example1/robust_rotor1_loss15_example1_linear_mpc_online_fault_allocation_sysblock/logs/sysplorer_robust_rotor1_loss15_example1_linear_mpc_online_fault_allocation_sysblock_20260512.jsonl
    row_count: 5001
    quality_status: pass
    position_rmse_m: 0.25820987678817897
    steady_state_error_m: 0.11495400361443171
    disturbance_peak_error_m: 0.10852229247699297
    disturbance_recovery_time_s: 2.530000000000001
    total_health_score: 51.29889148883444
    rmse_reduction_vs_linear_mpc_pct: 17.778
    eta_hat_final: 0.90557548713665
    eta_hat_tail_mean_45_50s: 0.9083956325514871
