controller_id: nmpc_indi_l1
type: nmpc_outer_indi_inner_l1_disturbance_compensation
priority: P1

model_interface:
  replacement_component: controller3_2
  compatible_source_model: QuadrotorModel.Blocks.Controller.Controller
  implementation_target:
    - Sysblock subsystem
    - external function prototype
  inputs:
    position: sensors1_1.PosMea
    attitude: sensors1_1.AngleMea
    position_command: climbePath.position_command
    velocity: derived_from_position
    angular_rate: optional_sensor_or_derivative
    disturbance_event: scenario.disturbance
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
    controller_mode: controller_mode
    disturbance_hat: disturbance_hat_xyz
    safety_active: safety_active
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

outer_loop:
  fallback_type: linear_mpc
  horizon_steps: 20
  dt: 0.05
  q_position: [10.0, 10.0, 14.0]
  q_velocity: [2.0, 2.0, 3.0]
  r_acceleration: [0.15, 0.15, 0.25]
  velocity_limit_m_s: 6.0
  acceleration_limit_m_s2: 5.0

indi_inner_loop:
  angular_acc_filter_alpha: 0.85
  control_effectiveness_update: true
  torque_limit_nm: [1.5, 1.5, 0.8]

l1_compensation:
  enabled: true
  residual_filter_alpha: 0.90
  compensation_limit_m_s2: 2.0

safety_filter:
  enabled: true
  roll_max_rad: 0.61
  pitch_max_rad: 0.61
  min_altitude_m: 0.2
  motor_cmd_min: 0.0
  motor_cmd_max: 1.0

logging:
  required_signals:
    - controller_mode
    - disturbance_hat_x
    - disturbance_hat_y
    - disturbance_hat_z
    - safety_active
    - saturation_flag
