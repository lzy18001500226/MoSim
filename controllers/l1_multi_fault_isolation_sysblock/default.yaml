controller_id: l1_multi_fault_isolation_sysblock
type: sysblock_l1_residual_four_rotor_online_fault_isolation_and_allocation
priority: P1-B

description: >
  Project Sysblock controller that extends the single-rotor eta_hat prototype
  into a four-rotor online fault-isolation vector. It estimates eta_hat1..4
  from lateral residual signatures, outputs fault_index, and applies per-rotor
  allocation compensation before motor command saturation.

implementation_status:
  current_mworks_model:
    - QuadrotorExperiments.Example1Rotor1Loss15L1MultiFaultIsolationSysblockClosedLoop
    - QuadrotorExperiments.Example1Rotor2Loss15L1MultiFaultIsolationSysblockClosedLoop
    - QuadrotorExperiments.Example1Rotor3Loss15L1MultiFaultIsolationSysblockClosedLoop
    - QuadrotorExperiments.Example1Rotor4Loss15L1MultiFaultIsolationSysblockClosedLoop
  sysblock_controller: AWFF_L1MultiFaultIsolationControllerEquation_Sysblock
  verification_scope: real MWORKS_MCP 50 s full runs complete for rotor-1..4 85% efficiency degradation; quality_status pass; fault_index correct after initial detection
  limitation: >
    Current isolation signatures are based on the Example1 climb-path lateral
    residual geometry and are verified on persistent single-rotor degradation.
    The current fault_index logic is a first reliable-hit latch; transient
    faults, changing faults, or simultaneous multi-rotor faults require a reset
    or mode-switch extension.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: AWFF_L1OnlineFaultAllocationControllerEquation_Sysblock
  implementation_target:
    - Sysblock controller component
    - Project-owned rotor efficiency degradation Example1 closed-loop wrappers
  inputs:
    x_error: climbePath.position_command[1] - sensors1_1.PosMea[1]
    y_error: climbePath.position_command[2] - sensors1_1.PosMea[2]
    z_error: climbePath.position_command[3] - sensors1_1.PosMea[3]
    z_ref_rate: zero-order placeholder
    attitude: sensors1_1.AngleMea
    yaw_ref: zero-order placeholder
  outputs:
    motor_1: y, allocation compensated by eta_hat1
    motor_2: y1, allocation compensated by eta_hat2
    motor_3: y2, allocation compensated by eta_hat3
    motor_4: y3, allocation compensated by eta_hat4
    diagnostic_eta_hat1: eta_hat1
    diagnostic_eta_hat2: eta_hat2
    diagnostic_eta_hat3: eta_hat3
    diagnostic_eta_hat4: eta_hat4
    diagnostic_fault_index: fault_index
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3
    - controller3_2.eta_hat1
    - controller3_2.eta_hat2
    - controller3_2.eta_hat3
    - controller3_2.eta_hat4
    - controller3_2.fault_index

fault_isolation:
  rotor_to_plant_gain_map:
    rotor_1: quadChassisTest17_1.gain2.k
    rotor_2: quadChassisTest17_1.gain3.k
    rotor_3: quadChassisTest17_1.gain4.k
    rotor_4: quadChassisTest17_1.gain5.k
  nominal_lift_gain: 0.002
  degraded_lift_gain: 0.0017
  true_efficiency_for_validation: 0.85
  eta_min_est: 0.50
  eta_max_est: 1.00
  eta_est_filter_T: 5.0
  eta_signature_deadband: 0.015
  eta_signature_gain: 2.65
  fault_lock_margin: 0.012
  allocation_blend: 0.52
  diagnostic_signals:
    - controller3_2.eta_hat1
    - controller3_2.eta_hat2
    - controller3_2.eta_hat3
    - controller3_2.eta_hat4
    - controller3_2.fault_index

acceptance:
  rotor1_degradation:
    scenario_file: scenarios/robustness/example1_rotor1_loss15_l1_multi_fault_isolation_sysblock.yaml
    required: check_model, simulate_model, eta_hat1..4 raw columns, fault_index raw column, metrics, figures, replay JSON
    target_quality: pass_or_better_than_l1_residual
    expected_fault_index: 1
  rotor2_degradation:
    scenario_file: scenarios/robustness/example1_rotor2_loss15_l1_multi_fault_isolation_sysblock.yaml
    required: check_model, simulate_model, eta_hat1..4 raw columns, fault_index raw column, metrics, figures, replay JSON
    target_quality: pass
    expected_fault_index: 2
  rotor3_degradation:
    scenario_file: scenarios/robustness/example1_rotor3_loss15_l1_multi_fault_isolation_sysblock.yaml
    required: check_model, simulate_model, eta_hat1..4 raw columns, fault_index raw column, metrics, figures, replay JSON
    target_quality: pass
    expected_fault_index: 3
  rotor4_degradation:
