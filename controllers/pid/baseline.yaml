controller_id: pid_baseline
type: official_pid
priority: P0

description: Official MWORKS quadrotor PID baseline used as the comparison anchor.

limits:
  roll_max_rad: 0.61
  pitch_max_rad: 0.61
  yaw_rate_max_rad_s: 2.0
  motor_cmd_min: 0.0
  motor_cmd_max: 1.0

logging:
  required_signals:
    - controller_mode
    - thrust
    - torque_x
    - torque_y
    - torque_z
    - u1
    - u2
    - u3
    - u4

