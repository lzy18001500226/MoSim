controller_id: improved_pid
type: pid_with_feedforward_and_anti_windup
priority: P0

features:
  anti_windup: true
  derivative_filter: true
  reference_feedforward: true
  command_saturation: true

model_interface:
  replacement_component: controller3_2
  compatible_source_model: QuadrotorModel.Blocks.Controller.Controller
  implementation_target:
    - Sysblock subsystem
    - Modelica controller class
  inputs:
    position: sensors1_1.PosMea
    attitude: sensors1_1.AngleMea
    position_command: climbePath.position_command
    velocity: derived_from_position
    reference_velocity: derived_from_position_command
    reference_acceleration: derived_from_position_command
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
    debug_saturation: saturation_flag
    debug_integral: integral_state
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

position_loop:
  kp: [1.2, 1.2, 1.8]
  ki: [0.02, 0.02, 0.05]
  kd: [0.8, 0.8, 1.0]
  derivative_filter_alpha: 0.75
  integral_limit: [0.6, 0.6, 0.8]

attitude_loop:
  kp: [5.0, 5.0, 2.5]
  ki: [0.02, 0.02, 0.01]
  kd: [0.15, 0.15, 0.08]
  derivative_filter_alpha: 0.80

limits:
  roll_max_rad: 0.61
  pitch_max_rad: 0.61
  acceleration_max_m_s2: 5.0
  motor_cmd_min: 0.0
  motor_cmd_max: 1.0

fallback:
  controller_id: pid_baseline
  trigger:
    - nan_output
    - saturation_ratio_gt_0_8
