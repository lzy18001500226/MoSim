controller_id: awff_pid
type: anti_windup_feedforward_pid
priority: P1

description: >
  Project-owned anti-windup and reference-feedforward PID controller. Unlike
  enhanced_pid, this branch replaces the official controller component in
  project-owned Example1/2/3 and robustness clones while keeping the same
  input/output interface and result variable names.

features:
  independent_controller_model: true
  conditional_integration_anti_windup: true
  vertical_reference_feedforward: true
  derivative_action: true
  command_limit_tightening: true

implementation_status:
  current_mworks_models:
    - QuadrotorExperiments.Example1AntiWindupFeedforwardPID
    - QuadrotorExperiments.Example2AntiWindupFeedforwardPID
    - QuadrotorExperiments.Example2HelixTunedAntiWindupFeedforwardPID
    - QuadrotorExperiments.Example3AntiWindupFeedforwardPID
    - QuadrotorExperiments.Example1Mass20AntiWindupFeedforwardPID
    - QuadrotorExperiments.Example1WindGustAntiWindupFeedforwardPID
    - QuadrotorExperiments.Example1Rotor1Loss15AntiWindupFeedforwardPID
  base_controller: controllers/enhanced_pid/default.yaml
  verification_scope: >
    Full Example1/2/3 official scenarios and mass/wind/rotor-loss robustness
    scenarios have real Sysplorer MCP evidence. Example1, Example2 helix tuned,
    Example3, mass +20%, and lateral wind-gust are useful positive evidence.
    Rotor-loss remains needs_iteration.

model_interface:
  replacement_component: controller3_2
  compatible_source_model: QuadrotorModel.Blocks.Controller.Controller
  implementation_target:
    - Modelica project-owned controller
    - Modelica project-owned Example1/2/3 and robustness clones
  inputs:
    position: sensors1_1.PosMea
    attitude: sensors1_1.AngleMea
    position_command: climbePath.position_command
  outputs:
    motor_1: y
    motor_2: y1
    motor_3: y2
    motor_4: y3
  required_result_variables:
    - sensors1_1.PosMea[1]
    - sensors1_1.PosMea[2]
    - sensors1_1.PosMea[3]
    - sensors1_1.AngleMea[1]
    - sensors1_1.AngleMea[2]
    - sensors1_1.AngleMea[3]
    - climbePath.position_command[1]
    - climbePath.position_command[2]
    - climbePath.position_command[3]
    - controller3_2.y
    - controller3_2.y1
    - controller3_2.y2
    - controller3_2.y3

position_loop:
  kp: [1.65, 1.65, 8.0]
  ki: [0.0, 0.0, 6.0]
  kd: [1.0, 1.0, 4.0]

attitude_loop:
  kp: [14.142, 14.142, 5.0]
  ki: [0.0, 0.0, 0.0]
  kd: [1.70, 1.70, 0.0]

limits:
  roll_command_max_rad: 0.20944
  pitch_command_max_rad: 0.20944
  attitude_control_max: 6.5
  yaw_control_max: 6.5
  motor_command_abs_max: 20.0

feedforward:
  vertical_reference_rate_gain: 0.35
  reference_filter_T_s: 0.20

acceptance:
  full_example1:
    baseline_experiment: official_example1_enhanced_pid
    scenario_file: scenarios/official/example1_awff_pid.yaml
    expected: stable full run with no NaN and metrics available
  full_example2:
    baseline_experiment: official_example2_pid_baseline
    comparison_experiment: official_example2_enhanced_pid
    scenario_file: scenarios/official/example2_awff_pid.yaml
    expected: >
      Stable 50 s run with no NaN and metrics available. Current
      quality_status is needs_iteration because RMSE improvement is below the
      0.5% gate. Migrate the Example2HelixTunedEnhancedPID lateral command
      limits into the AWFF PID/Sysblock branch before using this as complete
      Example2 evidence.
  full_example2_helix_tuned:
    baseline_experiment: official_example2_improved_pid
    comparison_experiment: official_example2_awff_pid_helix_tuned
    scenario_file: scenarios/official/example2_awff_pid_helix_tuned.yaml
    expected: >
      Stable 50 s run with quality_status pass. Uses 15 deg lateral command
      limits and 7.0 attitude command limits for the CirclePath onset at 10 s.
  full_example3:
    baseline_experiment: official_example3_pid_baseline
    comparison_experiment: official_example3_enhanced_pid
    scenario_file: scenarios/official/example3_awff_pid.yaml
    expected: stable 120 s run with quality_status pass
  robust_mass20_example1:
    baseline_experiment: robust_mass20_example1_pid_baseline
    scenario_file: scenarios/robustness/example1_mass20_awff_pid.yaml
    expected: stable 50 s run with quality_status pass
  robust_wind_gust_example1:
    baseline_experiment: robust_wind_gust_example1_pid_baseline
    scenario_file: scenarios/robustness/example1_wind_gust_awff_pid.yaml
    expected: stable 50 s run with quality_status pass
  robust_rotor1_loss15_example1:
    baseline_experiment: robust_rotor1_loss15_example1_pid_baseline
    scenario_file: scenarios/robustness/example1_rotor1_loss15_awff_pid.yaml
    expected: >
      Stable 50 s run with metrics available. Current quality_status is
      needs_iteration because total_health_score remains below 40; this should
      be handled by fault detection and control allocation, not by claiming
      fixed-gain PID has solved actuator degradation.

verified_results:
  full_example1:
    scenario_file: scenarios/official/example1_awff_pid.yaml
    raw_file: results/official/example1_step/official_example1_awff_pid/raw/official_example1_awff_pid.csv
    metrics_file: results/official/example1_step/official_example1_awff_pid/metrics/official_example1_awff_pid.json
    mcp_log: results/official/example1_step/official_example1_awff_pid/logs/sysplorer_example1_awff_pid_full_20260510.jsonl
    row_count: 25001
    position_rmse_m: 0.2599138901
    max_position_error_m: 1.2413616018
    steady_state_error_m: 0.1032290791
    max_tilt_rad: 0.1744897004
    rmse_improvement_vs_pid_baseline_pct: 5.5726443900
    rmse_improvement_vs_enhanced_pid_pct: 2.3799029949
    comparison_note: >
      Constraint violation count and total health score are not strictly
      comparable with 5001-row baseline/enhanced outputs because this raw export
      contains 25001 rows.
  full_example2:
    scenario_file: scenarios/official/example2_awff_pid.yaml
    raw_file: results/official/example2_helix/official_example2_awff_pid/raw/official_example2_awff_pid.csv
    metrics_file: results/official/example2_helix/official_example2_awff_pid/metrics/official_example2_awff_pid.json
    mcp_log: results/official/example2_helix/official_example2_awff_pid/logs/sysplorer_example2_awff_pid_full_20260511.jsonl
    row_count: 25001
    position_rmse_m: 0.4866207910
    rmse_improvement_vs_pid_baseline_pct: 0.1153574467
    quality_status: needs_iteration
  full_example2_helix_tuned:
    scenario_file: scenarios/official/example2_awff_pid_helix_tuned.yaml
    raw_file: results/official/example2_helix/official_example2_awff_pid_helix_tuned/raw/official_example2_awff_pid_helix_tuned.csv
    metrics_file: results/official/example2_helix/official_example2_awff_pid_helix_tuned/metrics/official_example2_awff_pid_helix_tuned.json
    mcp_log: results/official/example2_helix/official_example2_awff_pid_helix_tuned/logs/sysplorer_example2_awff_pid_helix_tuned_full_20260511.jsonl
    row_count: 25001
    position_rmse_m: 0.4747993989
    rmse_improvement_vs_pid_baseline_pct: 2.542
    rmse_improvement_vs_improved_pid_pct: 1.0493403680
    max_tilt_rad: 0.3536107851
    quality_status: pass
  full_example3:
    scenario_file: scenarios/official/example3_awff_pid.yaml
    raw_file: results/official/example3_figure8/official_example3_awff_pid/raw/official_example3_awff_pid.csv
    metrics_file: results/official/example3_figure8/official_example3_awff_pid/metrics/official_example3_awff_pid.json
    mcp_log: results/official/example3_figure8/official_example3_awff_pid/logs/sysplorer_example3_awff_pid_full_20260511.jsonl
    row_count: 60001
    position_rmse_m: 0.1647333521
    rmse_improvement_vs_pid_baseline_pct: 4.3976450820
    quality_status: pass
