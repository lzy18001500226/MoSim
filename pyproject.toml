[project]
name = "quadrotor-mworks"
version = "0.1.0"
description = "MWORKS quadrotor control simulation automation and evidence tooling."
requires-python = ">=3.10"
dependencies = [
  "pytest>=9.0.0",
  "pyyaml>=6.0.0",
  "yacs==0.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --capture=no"
